  <!-- Tailwind CSS -->

  <!-- React & ReactDOM -->

  <style>

      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11', 'tnum';

    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      body { background-color: #ffffff !important; }
    }
  </style>
</head>
<body class="h-full text-slate-900 antialiased flex flex-col">
  <div id="root" class="flex flex-col flex-1"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // --- RÉFÉRENTIEL ACADÉMIQUE ---
    const INSTITUTION_CONFIG = {

    };

    const CURRICULUM = {

        { id: 'math', name: 'Mathématiques', coef: 4, teacher: 'M. Diop' },
        { id: 'pc', name: 'Sciences Physiques', coef: 3, teacher: 'Mme Faye' },
        { id: 'fr', name: 'Lettres & Philosophie', coef: 3, teacher: 'M. Ndiaye' },
        { id: 'ang', name: 'Anglais', coef: 2, teacher: 'Mme Ba' },
        { id: 'svt', name: 'Sciences de la Vie et de la Terre', coef: 2, teacher: 'M. Cissé' },
        { id: 'hg', name: 'Histoire & Géographie', coef: 2, teacher: 'M. Sène' }
      ],
      Premiere: [
        { id: 'math', name: 'Mathématiques', coef: 5, teacher: 'M. Diop' },
        { id: 'pc', name: 'Sciences Physiques', coef: 4, teacher: 'Mme Faye' },
        { id: 'fr', name: 'Français', coef: 3, teacher: 'M. Ndiaye' },
        { id: 'ang', name: 'Anglais', coef: 2, teacher: 'Mme Ba' }
      ],
      Terminale: [
        { id: 'math', name: 'Mathématiques', coef: 6, teacher: 'M. Diop' },
        { id: 'pc', name: 'Sciences Physiques', coef: 5, teacher: 'Mme Faye' },
        { id: 'philo', name: 'Philosophie', coef: 3, teacher: 'M. Sow' }
      ]
    };

    const INITIAL_COHORT = {
      Seconde: [
        { id: 'ST-001', matricule: '2026-001S', lastName: 'DIALLO', firstName: 'Moussa', sex: 'M', birthDate: '2008-04-12', phone: '+221 77 123 45 67', paidFees: 45000 },
        { id: 'ST-002', matricule: '2026-002S', lastName: 'NDIAYE', firstName: 'Fatou', sex: 'F', birthDate: '2008-09-21', phone: '+221 77 987 65 43', paidFees: 50000 },
        { id: 'ST-003', matricule: '2026-003S', lastName: 'SOW', firstName: 'Amadou', sex: 'M', birthDate: '2007-11-05', phone: '+221 76 543 21 09', paidFees: 25000 },
        { id: 'ST-004', matricule: '2026-004S', lastName: 'BA', firstName: 'Aïssatou', sex: 'F', birthDate: '2008-02-18', phone: '+221 70 888 99 00', paidFees: 50000 }
      ]
    };

    const INITIAL_EVALUATIONS = {
      'ST-001': {
        math: { d1: 14.0, d2: 15.0, compo: 13.5 },
        pc:   { d1: 12.0, d2: 14.0, compo: 13.0 },
        fr:   { d1: 11.0, d2: 12.0, compo: 10.0 },
        ang:  { d1: 13.5, d2: 14.0, compo: 13.5 },
        svt:  { d1: 12.0, d2: 13.0, compo: 12.5 },
        hg:   { d1: 14.0, d2: 13.0, compo: 13.0 }
      },
      'ST-002': {
        math: { d1: 18.0, d2: 17.5, compo: 19.0 },
        pc:   { d1: 16.0, d2: 17.0, compo: 18.0 },
        fr:   { d1: 15.0, d2: 14.0, compo: 16.0 },
        ang:  { d1: 17.0, d2: 18.0, compo: 17.5 },
        svt:  { d1: 16.0, d2: 17.0, compo: 16.5 },
        hg:   { d1: 15.0, d2: 16.0, compo: 15.0 }
      },
      'ST-003': {
        math: { d1: 9.0, d2: 10.0, compo: 8.5 },
        pc:   { d1: 11.0, d2: 10.0, compo: 9.0 },
        fr:   { d1: 12.0, d2: 13.0, compo: 12.0 },
        ang:  { d1: 10.0, d2: 11.0, compo: 10.0 },
        svt:  { d1: 9.0, d2: 10.0, compo: 9.5 },
        hg:   { d1: 11.0, d2: 12.0, compo: 11.0 }
      },
      'ST-004': {
        math: { d1: 13.0, d2: 12.0, compo: 14.0 },
        pc:   { d1: 14.0, d2: 15.0, compo: 13.5 },
        fr:   { d1: 16.0, d2: 15.5, compo: 15.0 },
        ang:  { d1: 14.0, d2: 15.0, compo: 14.5 },
        svt:  { d1: 13.0, d2: 14.0, compo: 13.5 },
        hg:   { d1: 14.0, d2: 15.0, compo: 14.0 }
      }
    };

    const INITIAL_SUBMISSIONS = [
      {
        id: 'SUB-2026-01',
        studentId: 'ST-002',
        studentName: 'NDIAYE Fatou',
        matricule: '2026-002S',
        assignmentTitle: 'Devoir Surveillé n°1 : Algèbre & Polynômes',
        subjectName: 'Mathématiques',
        submittedAt: '2026-09-06T14:30:00Z',
        fileName: '2026-002S_NDIAYE_Devoir1.pdf',
        folderPath: 'Mathématiques - M. Diop / DS1_Algebre',
        grade: 18.5,
        status: 'validated'
      },
      {
        id: 'SUB-2026-02',
        studentId: 'ST-001',
        studentName: 'DIALLO Moussa',
        matricule: '2026-001S',
        assignmentTitle: 'Devoir Surveillé n°1 : Algèbre & Polynômes',
        subjectName: 'Mathématiques',
        submittedAt: '2026-09-07T09:15:00Z',
        fileName: '2026-001S_DIALLO_Devoir1.pdf',
        folderPath: 'Mathématiques - M. Diop / DS1_Algebre',
        grade: 14.0,
        status: 'validated'
      }
    ];

    function App() {
      const [currentClass, setCurrentClass] = useState('Seconde');
      const [activeModule, setActiveModule] = useState('grades'); // 'grades' | 'students' | 'homework' | 'bulletins'
      const [students, setStudents] = useState(INITIAL_COHORT.Seconde);
      const [evaluations, setEvaluations] = useState(INITIAL_EVALUATIONS);
      const [submissions, setSubmissions] = useState(INITIAL_SUBMISSIONS);
      const [selectedBulletinStudent, setSelectedBulletinStudent] = useState(null);
      const [notification, setNotification] = useState(null);

      // Dossier Google Drive de l'enseignant
      const [driveConfig, setDriveConfig] = useState({
        teacherName: 'M. Diop',
        subjectName: 'Mathématiques',
        targetFolder: 'Mathématiques — M. Diop (Seconde S)',
        driveFolderId: '1AbC_dEfGhIjKlMnOpQrStUvWxYz',
        organizationMode: 'by_assignment', // by_assignment | by_student | chronological
        fileNamingRule: 'MATRICULE_NOM_DEVOIR'
      });

      const notify = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(null), 3000);
      };

      const subjects = CURRICULUM[currentClass] || [];

      // Moteur de calcul statistique académique
      const metrics = useMemo(() => {
        const results = {};
        students.forEach((st) => {
          let weightedSum = 0;
          let totalCoefficients = 0;
          const subjectBreakdown = {};

          subjects.forEach((sub) => {
            const ev = evaluations[st.id]?.[sub.id];
            if (ev && ev.compo !== undefined) {
              const dAvg = (ev.d1 !== undefined && ev.d2 !== undefined) ? (ev.d1 + ev.d2) / 2 : (ev.d1 || ev.d2 || ev.compo);
              const subAvg = Number(((dAvg + ev.compo * 2) / 3).toFixed(2));
              weightedSum += subAvg * sub.coef;
              totalCoefficients += sub.coef;
              subjectBreakdown[sub.id] = { ...ev, avg: subAvg };
            }
          });

          const generalAverage = totalCoefficients > 0 ? Number((weightedSum / totalCoefficients).toFixed(2)) : null;
          results[st.id] = { generalAverage, subjectBreakdown, weightedSum, totalCoefficients };
        });

        const rankedList = Object.entries(results)
          .filter(([_, d]) => d.generalAverage !== null)
          .sort((a, b) => b[1].generalAverage - a[1].generalAverage);

        rankedList.forEach(([id], index) => {
          results[id].rank = index + 1;
        });

        const avgs = Object.values(results).map(r => r.generalAverage).filter(a => a !== null);
        const cohortMean = avgs.length > 0 ? (avgs.reduce((acc, v) => acc + v, 0) / avgs.length).toFixed(2) : '0.00';
        const passingRate = avgs.length > 0 ? Math.round((avgs.filter(v => v >= 10).length / avgs.length) * 100) : 0;
        const totalTuitionCollected = students.reduce((acc, s) => acc + s.paidFees, 0);

        return { studentMetrics: results, cohortMean, passingRate, totalTuitionCollected };
      }, [students, subjects, evaluations]);

      const handleScoreUpdate = (studentId, subjectId, component, value) => {
        const cleanVal = value === '' ? '' : Math.min(20, Math.max(0, parseFloat(value) || 0));
        setEvaluations(prev => ({
          ...prev,
          [studentId]: {
            ...(prev[studentId] || {}),
            [subjectId]: {
              ...(prev[studentId]?.[subjectId] || {}),
              [component]: cleanVal
            }
          }
        }));
      };

      return (
        <div className="flex flex-col min-h-screen bg-slate-100">
          {/* Notification système */}
          {notification && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white text-xs font-medium px-4 py-3 rounded-lg shadow-xl border border-slate-700 flex items-center gap-2.5 animate-fade-in">
              <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
              <span>{notification}</span>
            </div>
          )}

          {/* En-tête institutionnel */}
          <header className="bg-slate-900 text-white border-b border-slate-800 no-print sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 rounded bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-xs text-indigo-400">
                  GN
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-semibold text-sm tracking-tight text-slate-100">GestNotes Administration</span>
                    <span className="text-[10px] uppercase font-mono px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700">v4.2 PRO</span>
                  </div>
                  <div className="text-[11px] text-slate-400">{INSTITUTION_CONFIG.name} • {INSTITUTION_CONFIG.academicYear}</div>
                </div>
              </div>

              {/* Sélecteur de division académique & actions */}
              <div className="flex items-center gap-3">
                <div className="flex items-center gap-1.5 bg-slate-800 p-1 rounded-md border border-slate-700 text-xs">
                  <span className="text-slate-400 px-2 font-medium">Division :</span>
                  <select
                    value={currentClass}
                    onChange={(e) => setCurrentClass(e.target.value)}
                    className="bg-slate-900 text-white px-2.5 py-1 rounded font-medium border border-slate-700 outline-none cursor-pointer"
                  >
                    <option value="Seconde">Seconde S (Scientifique)</option>
                    <option value="Premiere">Première S (Scientifique)</option>
                    <option value="Terminale">Terminale S (Scientifique)</option>
                  </select>
                </div>

                <div className="h-4 w-px bg-slate-700"></div>

                <div className="flex items-center gap-1">
                  <button
                    onClick={() => setActiveModule('grades')}
                    className={`px-3 py-1.5 rounded text-xs font-medium transition-colors ${activeModule === 'grades' ? 'bg-slate-800 text-white border border-slate-700' : 'text-slate-400 hover:text-slate-200'}`}
                  >
                    Relevé des Notes
                  </button>
                  <button
                    onClick={() => setActiveModule('students')}
                    className={`px-3 py-1.5 rounded text-xs font-medium transition-colors ${activeModule === 'students' ? 'bg-slate-800 text-white border border-slate-700' : 'text-slate-400 hover:text-slate-200'}`}
                  >
                    Immatriculation & Droits
                  </button>
                  <button
                    onClick={() => setActiveModule('homework')}
                    className={`px-3 py-1.5 rounded text-xs font-medium transition-colors ${activeModule === 'homework' ? 'bg-slate-800 text-white border border-slate-700' : 'text-slate-400 hover:text-slate-200'}`}
                  >
                    Dépôts & Google Drive
                  </button>
                  <button
                    onClick={() => setActiveModule('bulletins')}
                    className={`px-3 py-1.5 rounded text-xs font-medium transition-colors ${activeModule === 'bulletins' ? 'bg-slate-800 text-white border border-slate-700' : 'text-slate-400 hover:text-slate-200'}`}
                  >
                    Bulletins Officiels
                  </button>
                </div>
              </div>
            </div>
          </header>

          {/* Tableau de bord principal */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">

            {/* Indicateurs synthétiques de cohorte */}
            <div className="grid grid-cols-1 sm:grid-cols-4 gap-4 no-print">
              <div className="bg-white p-4 rounded-lg border border-slate-200 shadow-xs">
                <div className="text-[11px] font-semibold text-slate-500 uppercase tracking-wider">Effectif Inscrit</div>
                <div className="text-xl font-bold text-slate-900 mt-1">{students.length} Apprenants</div>
                <div className="text-[11px] text-slate-500 mt-0.5">Registre officiel à jour</div>
              </div>
              <div className="bg-white p-4 rounded-lg border border-slate-200 shadow-xs">
                <div className="text-[11px] font-semibold text-slate-500 uppercase tracking-wider">Moyenne Générale Cohorte</div>
                <div className="text-xl font-bold text-slate-900 mt-1">{metrics.cohortMean} <span className="text-xs text-slate-400 font-normal">/ 20</span></div>
                <div className="text-[11px] text-slate-500 mt-0.5">{INSTITUTION_CONFIG.period}</div>
              </div>
              <div className="bg-white p-4 rounded-lg border border-slate-200 shadow-xs">
                <div className="text-[11px] font-semibold text-slate-500 uppercase tracking-wider">Taux d'Admissibilité (≥ 10/20)</div>
                <div className="text-xl font-bold text-slate-900 mt-1">{metrics.passingRate} %</div>
                <div className="text-[11px] text-slate-500 mt-0.5">Seuil institutionnel respecté</div>
              </div>
              <div className="bg-white p-4 rounded-lg border border-slate-200 shadow-xs">
                <div className="text-[11px] font-semibold text-slate-500 uppercase tracking-wider">Recouvrement Droits</div>
                <div className="text-xl font-bold text-slate-900 mt-1">{metrics.totalTuitionCollected.toLocaleString()} <span className="text-xs text-slate-400 font-normal">FCFA</span></div>
                <div className="text-[11px] text-slate-500 mt-0.5">Sur {(students.length * INSTITUTION_CONFIG.tuitionDuePerStudent).toLocaleString()} FCFA attendus</div>
              </div>
            </div>

            {/* MODULE 1 : RELEVÉ ACADÉMIQUE DE NOTES */}
            {activeModule === 'grades' && (
              <div className="bg-white rounded-lg border border-slate-200 shadow-xs overflow-hidden">
                <div className="px-5 py-3.5 border-b border-slate-200 bg-slate-50 flex items-center justify-between flex-wrap gap-2">
                  <div>
                    <h2 className="text-sm font-bold text-slate-900">Registre d'Évaluation Périodique — {currentClass}</h2>
                    <p className="text-xs text-slate-500">Pondération réglementaire : Moyenne = [((Devoir 1 + Devoir 2) ÷ 2) + Composition × 2] ÷ 3</p>
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => notify("Données académiques validées et enregistrées dans la base de registre.")}
                      className="px-3.5 py-1.5 bg-slate-900 hover:bg-slate-800 text-white rounded text-xs font-semibold shadow-xs"
                    >
                      Enregistrer les saisies
                    </button>
                  </div>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs border-collapse">
                    <thead>
                      <tr className="bg-slate-100 text-slate-600 font-semibold border-b border-slate-200">
                        <th className="py-2.5 px-3 border-r border-slate-200 w-28">N° Matricule</th>
                        <th className="py-2.5 px-3 border-r border-slate-200 w-44">Identité de l'Élève</th>
                        {subjects.map(s => (
                          <th key={s.id} className="py-2.5 px-2 text-center border-r border-slate-200 font-semibold">
                            <div>{s.name}</div>
                            <div className="text-[10px] text-slate-500 font-normal">Coef. {s.coef} (D1 / D2 / Compo)</div>
                          </th>
                        ))}
                        <th className="py-2.5 px-3 text-center border-r border-slate-200 bg-slate-50 w-28">Moyenne</th>
                        <th className="py-2.5 px-3 text-center bg-slate-50 w-20">Rang</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-200 text-slate-700">
                      {students.map(st => {
                        const m = metrics.studentMetrics[st.id] || {};
                        return (
                          <tr key={st.id} className="hover:bg-slate-50/75">
                            <td className="py-2.5 px-3 font-mono font-medium text-slate-500 border-r border-slate-200">{st.matricule}</td>
                            <td className="py-2.5 px-3 font-semibold text-slate-900 border-r border-slate-200">{st.lastName} {st.firstName}</td>
                            {subjects.map(s => {
                              const ev = evaluations[st.id]?.[s.id] || {};
                              const subAvg = m.subjectBreakdown?.[s.id]?.avg;
                              return (
                                <td key={s.id} className="p-2 border-r border-slate-200 text-center">
                                  <div className="inline-flex items-center gap-1">
                                    <input
                                      type="number"
                                      step="0.5"
                                      min="0"
                                      max="20"
                                      value={ev.d1 ?? ''}
                                      placeholder="D1"
                                      onChange={(e) => handleScoreUpdate(st.id, s.id, 'd1', e.target.value)}
                                      className="w-10 text-center border border-slate-200 rounded py-1 font-mono text-xs focus:border-slate-800 outline-none"
                                    />
                                    <input
                                      type="number"
                                      step="0.5"
                                      min="0"
                                      max="20"
                                      value={ev.d2 ?? ''}
                                      placeholder="D2"
                                      onChange={(e) => handleScoreUpdate(st.id, s.id, 'd2', e.target.value)}
                                      className="w-10 text-center border border-slate-200 rounded py-1 font-mono text-xs focus:border-slate-800 outline-none"
                                    />
                                    <input
                                      type="number"
                                      step="0.5"
                                      min="0"
                                      max="20"
                                      value={ev.compo ?? ''}
                                      placeholder="CP"
                                      onChange={(e) => handleScoreUpdate(st.id, s.id, 'compo', e.target.value)}
                                      className="w-11 text-center bg-slate-50 border border-slate-300 rounded py-1 font-mono font-semibold text-xs focus:border-slate-800 outline-none"
                                    />
                                  </div>
                                  {subAvg !== undefined && (
                                    <div className={`text-[11px] font-mono mt-0.5 ${subAvg >= 10 ? 'text-slate-900' : 'text-red-700'}`}>
                                      {subAvg.toFixed(2)}
                                    </div>
                                  )}
                                </td>
                              );
                            })}
                            <td className="py-2.5 px-3 text-center border-r border-slate-200 bg-slate-50 font-mono font-bold text-sm">
                              {m.generalAverage !== null ? (
                                <span className={m.generalAverage >= 10 ? 'text-slate-900' : 'text-red-700'}>
                                  {m.generalAverage.toFixed(2)}
                                </span>
                              ) : '—'}
                            </td>
                            <td className="py-2.5 px-3 text-center bg-slate-50 font-mono font-semibold text-slate-700">
                              {m.rank ? `${m.rank}e` : '—'}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* MODULE 2 : REGISTRE D'IMMATRICULATION & CAISSE */}
            {activeModule === 'students' && (
              <div className="bg-white rounded-lg border border-slate-200 shadow-xs overflow-hidden">
                <div className="px-5 py-3.5 border-b border-slate-200 bg-slate-50 flex items-center justify-between">
                  <div>
                    <h2 className="text-sm font-bold text-slate-900">Registre d'Immatriculation & Recouvrement des Frais de Scolarité</h2>
                    <p className="text-xs text-slate-500">Tarif trimestriel réglementaire : {INSTITUTION_CONFIG.tuitionDuePerStudent.toLocaleString()} FCFA par apprenant</p>
                  </div>
                  <button
                    onClick={() => notify("Formulaire d'immatriculation administrative ouvert.")}
                    className="px-3.5 py-1.5 bg-slate-900 hover:bg-slate-800 text-white rounded text-xs font-semibold shadow-xs"
                  >
                    + Immatriculer un Élève
                  </button>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs border-collapse">
                    <thead>
                      <tr className="bg-slate-100 text-slate-600 font-semibold border-b border-slate-200">
                        <th className="py-2.5 px-3">Matricule</th>
                        <th className="py-2.5 px-3">Nom & Prénoms</th>
                        <th className="py-2.5 px-3">Genre</th>
                        <th className="py-2.5 px-3">Date de Naissance</th>
                        <th className="py-2.5 px-3">Contact Tuteur</th>
                        <th className="py-2.5 px-3">Montant Reçu</th>
                        <th className="py-2.5 px-3">Situation</th>
                        <th className="py-2.5 px-3 text-right">Régularisation</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-200 text-slate-700">
                      {students.map(st => {
                        const isSettled = st.paidFees >= INSTITUTION_CONFIG.tuitionDuePerStudent;
                        const remainder = INSTITUTION_CONFIG.tuitionDuePerStudent - st.paidFees;
                        return (
                          <tr key={st.id} className="hover:bg-slate-50">
                            <td className="py-2.5 px-3 font-mono text-slate-500">{st.matricule}</td>
                            <td className="py-2.5 px-3 font-semibold text-slate-900">{st.lastName} {st.firstName}</td>
                            <td className="py-2.5 px-3">{st.sex === 'M' ? 'Masculin' : 'Féminin'}</td>
                            <td className="py-2.5 px-3 font-mono">{st.birthDate}</td>
                            <td className="py-2.5 px-3 font-mono">{st.phone}</td>
                            <td className="py-2.5 px-3 font-mono font-medium">{st.paidFees.toLocaleString()} FCFA</td>
                            <td className="py-2.5 px-3">
                              <span className={`px-2 py-0.5 rounded text-[10px] font-semibold uppercase ${isSettled ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                                {isSettled ? 'En règle' : `Reliquat: ${remainder.toLocaleString()} F`}
                              </span>
                            </td>
                            <td className="py-2.5 px-3 text-right">
                              {!isSettled && (
                                <button
                                  onClick={() => {
                                    const message = encodeURIComponent(`Avis d'échéance GestNotes — ${INSTITUTION_CONFIG.name} : Veuillez régulariser le reliquat de scolarité de ${remainder.toLocaleString()} FCFA pour l'élève ${st.firstName} ${st.lastName}.`);
                                    window.open(`https://wa.me/${st.phone.replace(/[^0-9]/g, '')}?text=${message}`, '_blank');
                                  }}
                                  className="px-2.5 py-1 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 font-medium text-[11px]"
                                >
                                  Relance Officielle
                                </button>
                              )}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* MODULE 3 : GESTION DU DOSSIER DÉDIÉ GOOGLE DRIVE */}
            {activeModule === 'homework' && (
              <div className="space-y-5">
                <div className="bg-white rounded-lg border border-slate-200 p-5 space-y-4 shadow-xs">
                  <div className="flex items-start justify-between flex-wrap gap-4 pb-4 border-b border-slate-200">
                    <div>
                      <h2 className="text-sm font-bold text-slate-900">Paramétrage du Dossier Dédié Enseignant (Google Drive)</h2>
                      <p className="text-xs text-slate-500">Centralisation automatisée et indexation hiérarchique des travaux numériques remis par les apprenants</p>
                    </div>
                    <a
                      href={`https://drive.google.com/drive/folders/${driveConfig.driveFolderId}`}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-white rounded text-xs font-semibold flex items-center gap-1.5 shadow-xs"
                    >
                      <span>Accéder au Dossier Drive</span>
                      <span>↗</span>
                    </a>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                    <div>
                      <label className="block text-slate-600 font-semibold mb-1">Intitulé du Dossier Racine :</label>
                      <input
                        type="text"
                        value={driveConfig.targetFolder}
                        onChange={(e) => setDriveConfig({ ...driveConfig, targetFolder: e.target.value })}
                        className="w-full border border-slate-300 rounded px-2.5 py-1.5 text-slate-900 font-mono focus:border-slate-800 outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-600 font-semibold mb-1">Règle de Classement Interne :</label>
                      <select
                        value={driveConfig.organizationMode}
                        onChange={(e) => { setDriveConfig({ ...driveConfig, organizationMode: e.target.value }); notify("Règle de structuration Drive actualisée."); }}
                        className="w-full border border-slate-300 rounded px-2.5 py-1.5 text-slate-900 font-medium focus:border-slate-800 outline-none"
                      >
                        <option value="by_assignment">Par Devoir / Évaluation (Dossier distinct)</option>
                        <option value="by_student">Par Apprenant (Dossier individuel annuel)</option>
                        <option value="chronological">Chronologique (Horodatage des réceptions)</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-600 font-semibold mb-1">Format de Nomenclature des Fichiers :</label>
                      <select
                        value={driveConfig.fileNamingRule}
                        onChange={(e) => setDriveConfig({ ...driveConfig, fileNamingRule: e.target.value })}
                        className="w-full border border-slate-300 rounded px-2.5 py-1.5 text-slate-900 font-medium focus:border-slate-800 outline-none"
                      >
                        <option value="MATRICULE_NOM_DEVOIR">[Matricule]_[Nom]_[Intitulé].pdf</option>
                        <option value="DEVOIR_MATRICULE_NOM">[Intitulé]_[Matricule]_[Nom].pdf</option>
                      </select>
                    </div>
                  </div>
                </div>

                {/* Journal d'audit des travaux centralisés */}
                <div className="bg-white rounded-lg border border-slate-200 shadow-xs overflow-hidden">
                  <div className="px-5 py-3.5 border-b border-slate-200 bg-slate-50 flex items-center justify-between">
                    <div>
                      <h3 className="text-sm font-bold text-slate-900">Registre des Travaux & Évaluations Réceptionnés</h3>
                      <p className="text-xs text-slate-500">Documents archivés et horodatés sur l'espace cloud institutionnel</p>
                    </div>
                    <span className="text-xs font-mono text-slate-600 bg-slate-200 px-2 py-0.5 rounded">
                      {submissions.length} documents enregistrés
                    </span>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs border-collapse">
                      <thead>
                        <tr className="bg-slate-100 text-slate-600 font-semibold border-b border-slate-200">
                          <th className="py-2 px-3">Date & Heure</th>
                          <th className="py-2 px-3">Apprenant</th>
                          <th className="py-2 px-3">Évaluation</th>
                          <th className="py-2 px-3">Nom du Fichier Stocké</th>
                          <th className="py-2 px-3">Arborescence Drive</th>
                          <th className="py-2 px-3 text-center">Note Validée</th>
                          <th className="py-2 px-3 text-right">Lien Document</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-200 text-slate-700">
                        {submissions.map(sub => (
                          <tr key={sub.id} className="hover:bg-slate-50">
                            <td className="py-2 px-3 font-mono text-slate-500">{new Date(sub.submittedAt).toLocaleString()}</td>
                            <td className="py-2 px-3 font-semibold text-slate-900">{sub.studentName} ({sub.matricule})</td>
                            <td className="py-2 px-3">{sub.assignmentTitle}</td>
                            <td className="py-2 px-3 font-mono text-slate-600">{sub.fileName}</td>
                            <td className="py-2 px-3 font-mono text-slate-500">{sub.folderPath}</td>
                            <td className="py-2 px-3 text-center font-mono font-bold text-slate-900">
                              {sub.grade !== undefined ? `${sub.grade} / 20` : 'En attente'}
                            </td>
                            <td className="py-2 px-3 text-right">
                              <a
                                href="https://drive.google.com"
                                target="_blank"
                                rel="noopener noreferrer"
                                className="text-indigo-600 hover:text-indigo-800 font-semibold"
                              >
                                Consulter sur Drive ↗
                              </a>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* MODULE 4 : ÉDITION DES BULLETINS OFFICIELS */}
            {activeModule === 'bulletins' && (
              <div className="space-y-4">
                <div className="bg-white rounded-lg border border-slate-200 p-4 no-print flex items-center justify-between flex-wrap gap-3 shadow-xs">
                  <div>
                    <h2 className="text-sm font-bold text-slate-900">Génération du Bulletin Trimestriel Officiel</h2>
                    <p className="text-xs text-slate-500">Sélectionnez l'apprenant pour générer le document réglementaire prêt à l'impression</p>
                  </div>
                  <div className="flex items-center gap-3">
                    <select
                      onChange={(e) => setSelectedBulletinStudent(students.find(s => s.id === e.target.value) || null)}
                      className="border border-slate-300 rounded px-3 py-1.5 text-xs font-semibold text-slate-800 outline-none"
                    >
                      <option value="">— Sélectionner un élève —</option>
                      {students.map(st => (
                        <option key={st.id} value={st.id}>{st.matricule} — {st.lastName} {st.firstName}</option>
                      ))}
                    </select>
                    {selectedBulletinStudent && (
                      <button
                        onClick={() => window.print()}
                        className="px-3.5 py-1.5 bg-slate-900 hover:bg-slate-800 text-white rounded text-xs font-semibold shadow-xs"
                      >
                        Imprimer le Document Officiel
                      </button>
                    )}
                  </div>
                </div>

                {/* MODÈLE DU BULLETIN (CONFORME NORMES ACADÉMIQUES) */}
                {selectedBulletinStudent && (
                  <div className="bg-white p-8 rounded-lg border border-slate-300 shadow-sm max-w-4xl mx-auto space-y-6 text-slate-900">
                    <div className="border-b-2 border-slate-900 pb-4 flex justify-between items-start text-xs">
                      <div>
                        <h3 className="font-extrabold text-sm uppercase tracking-wide">{INSTITUTION_CONFIG.name}</h3>
                        <p className="text-slate-600">{INSTITUTION_CONFIG.address}</p>
                        <p className="text-slate-600">Code Établissement : <span className="font-mono">{INSTITUTION_CONFIG.registrationCode}</span></p>
                      </div>
                      <div className="text-right">
                        <span className="font-extrabold text-base block tracking-tight">BULLETIN OFFICIEL DE NOTES</span>
                        <span className="font-semibold text-slate-700">{INSTITUTION_CONFIG.period} • Année {INSTITUTION_CONFIG.academicYear}</span>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-4 bg-slate-50 p-4 rounded border border-slate-200 text-xs">
                      <div className="space-y-1">
                        <div>Identité de l'Élève : <strong className="uppercase">{selectedBulletinStudent.lastName} {selectedBulletinStudent.firstName}</strong></div>
                        <div>Matricule National : <strong className="font-mono">{selectedBulletinStudent.matricule}</strong></div>
                        <div>Né(e) le : <strong className="font-mono">{selectedBulletinStudent.birthDate}</strong></div>
                      </div>
                      <div className="text-right space-y-1">
                        <div>Division : <strong>{currentClass} S</strong></div>
                        <div>Effectif Contrôlé : <strong>{students.length} Apprenants</strong></div>
                        <div>Rang Général : <strong>{metrics.studentMetrics[selectedBulletinStudent.id]?.rank || '—'}e sur {students.length}</strong></div>
                      </div>
                    </div>

                    <table className="w-full text-left text-xs border-collapse border border-slate-300">
                      <thead>
                        <tr className="bg-slate-100 font-semibold border-b border-slate-300">
                          <th className="p-2.5 border-r border-slate-300">Discipline Enseignée</th>
                          <th className="p-2.5 text-center border-r border-slate-300 w-16">Coef.</th>
                          <th className="p-2.5 text-center border-r border-slate-300 w-24">Moyenne / 20</th>
                          <th className="p-2.5 text-center border-r border-slate-300 w-28">Points Pondérés</th>
                          <th className="p-2.5">Appréciation du Conseil Pédagogique</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-300">
                        {subjects.map(s => {
                          const subAvg = metrics.studentMetrics[selectedBulletinStudent.id]?.subjectBreakdown?.[s.id]?.avg;
                          const weightedPts = subAvg !== undefined ? (subAvg * s.coef).toFixed(2) : '—';
                          return (
                            <tr key={s.id}>
                              <td className="p-2.5 border-r border-slate-300 font-medium">{s.name}</td>
                              <td className="p-2.5 text-center border-r border-slate-300 font-mono">{s.coef}</td>
                              <td className="p-2.5 text-center border-r border-slate-300 font-mono font-bold">
                                {subAvg !== undefined ? subAvg.toFixed(2) : '—'}
                              </td>
                              <td className="p-2.5 text-center border-r border-slate-300 font-mono">{weightedPts}</td>
                              <td className="p-2.5 text-slate-600 italic">
                                {subAvg >= 16 ? 'Excellent travail académique' : subAvg >= 14 ? 'Très bon ensemble, rigueur constante' : subAvg >= 12 ? 'Travail satisfaisant' : subAvg >= 10 ? 'Passable, consolider les bases' : 'Insuffisant, un suivi particulier est requis'}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>

                    <div className="flex justify-between items-end pt-4 text-xs border-t border-slate-200">
                      <div className="space-y-1">
                        <div>Moyenne Générale Trimestrielle : <strong className="text-base font-bold font-mono">{metrics.studentMetrics[selectedBulletinStudent.id]?.generalAverage?.toFixed(2) || '—'} / 20</strong></div>
                        <div>Moyenne de la Cohorte : <span className="font-mono">{metrics.cohortMean} / 20</span></div>
                        <div>Décision du Conseil : <strong>{metrics.studentMetrics[selectedBulletinStudent.id]?.generalAverage >= 10 ? 'Admis au tableau d\'honneur' : 'Avertissement de travail'}</strong></div>
                      </div>
                      <div className="text-center">
                        <div className="text-slate-600 mb-8">Le Chef d'Établissement</div>
                        <div className="font-bold uppercase tracking-wider">{INSTITUTION_CONFIG.headmaster}</div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* Pied de page */}
          <footer className="bg-white border-t border-slate-200 py-3 text-center text-[11px] text-slate-500 no-print mt-auto">
            GestNotes Infrastructure Pédagogique © 2026 — Plateforme d'Administration Scolaire & Synchronisation Sécurisée Google Drive
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
