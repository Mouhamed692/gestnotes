<!DOCTYPE html>
<html lang="fr"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4c1d95">
    <title>GestNotes – Administration scolaire</title>
    
    <!-- Chemins relatifs pour GitHub Pages -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="html2pdf.bundle.min.js"></script>
    <script src="idb-keyval.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Hanken Grotesk', sans-serif; background-color: #f8fafc; }
        .grid-table td, .grid-table th { border: 1px solid #e2e8f0; text-align: center; padding: 8px 6px; }
        .modal { transition: opacity 0.25s ease; }
        .hidden { display: none !important; }
    </style>
</head>

<body class="min-h-screen bg-slate-50 flex flex-col text-slate-800">

    <!-- HEADER (Identique à votre design) -->
    <header class="bg-[#4c1d95] text-white shadow-md px-4 py-3 md:px-6 flex flex-wrap items-center justify-between sticky top-0 z-40">
        <div class="flex items-center gap-3">
            <i class="fas fa-graduation-cap text-2xl text-violet-200"></i>
            <h1 class="text-xl font-bold">GestNotes</h1>
        </div>
        <div class="flex items-center gap-3">
            <select id="role-selector" onchange="onRoleChange()" class="bg-violet-950 text-white rounded-xl text-xs px-2 py-2">
                <option value="admin">👑 Admin</option>
                <option value="enseignant">📝 Enseignant</option>
            </select>
            <button onclick="openModal('settings-modal')" class="p-2 hover:bg-white/10 rounded-xl"><i class="fas fa-cog"></i></button>
        </div>
    </header>

    <main class="flex-1 p-4 md:p-6 max-w-[1400px] mx-auto w-full flex flex-col gap-6">
        
        <!-- BOUTONS ACTIONS RAPIDES -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                <button onclick="exportData()" class="bg-green-600 text-white py-2 rounded-xl text-sm font-bold"><i class="fas fa-download mr-2"></i>Exporter</button>
                <button onclick="document.getElementById('importFile').click()" class="bg-blue-600 text-white py-2 rounded-xl text-sm font-bold"><i class="fas fa-upload mr-2"></i>Importer</button>
                <input type="file" id="importFile" class="hidden" onchange="importData(event)">
                <button onclick="openModal('registration-modal')" class="bg-indigo-600 text-white py-2 rounded-xl text-sm font-bold"><i class="fas fa-user-plus mr-2"></i>Inscription</button>
            </div>
        </div>

        <!-- FILTRES NIVEAU ET OPTION -->
        <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex flex-wrap gap-4 items-end">
            <div class="flex-1 min-w-[150px]">
                <label class="block text-xs font-bold text-slate-500 mb-1">Niveau d'étude</label>
                <select id="filter-class" onchange="onClassChange()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm font-bold"></select>
            </div>
            <div class="flex-1 min-w-[150px]">
                <label class="block text-xs font-bold text-slate-500 mb-1">Série / Option</label>
                <select id="filter-section" onchange="onSectionChange()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm font-bold"></select>
            </div>
            <div class="flex gap-2">
                <button onclick="openModal('subjects-modal')" class="bg-violet-50 text-violet-700 px-4 py-2 rounded-xl text-xs font-bold border border-violet-100">Matières</button>
                <button onclick="openModal('fees-modal')" class="bg-amber-50 text-amber-700 px-4 py-2 rounded-xl text-xs font-bold border border-amber-100">Tarifs</button>
                <button onclick="openModal('caisse-modal')" class="bg-emerald-50 text-emerald-700 px-4 py-2 rounded-xl text-xs font-bold border border-emerald-100">Caisse</button>
            </div>
        </section>

        <!-- STATS FINANCIÈRES -->
        <section id="stats-section" class="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-2xl border border-slate-200">
                <p class="text-[10px] font-bold text-slate-400 uppercase">Encaissé</p>
                <p id="stats-total-encaisse" class="text-xl font-bold text-emerald-600">0 F</p>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200">
                <p class="text-[10px] font-bold text-slate-400 uppercase">Reste</p>
                <p id="stats-reste" class="text-xl font-bold text-rose-600">0 F</p>
            </div>
        </section>

        <!-- GRILLE DES NOTES -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-slate-700">Saisie des Notes</h3>
                <div class="flex gap-2">
                    <select id="grade-subject-select" onchange="renderGradesGrid()" class="text-sm border rounded-lg p-1"></select>
                    <button onclick="goToNextSubject()" class="bg-slate-800 text-white text-xs px-3 py-1 rounded-lg">Suivant</button>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-xs grid-table">
                    <thead class="bg-slate-100">
                        <tr>
                            <th class="text-left">Élève</th>
                            <th>Dev1</th>
                            <th>Dev2</th>
                            <th class="bg-violet-50">Compo</th>
                        </tr>
                    </thead>
                    <tbody id="grades-table-body"></tbody>
                </table>
            </div>
        </section>

        <!-- LISTE ÉLÈVES -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-4 border-b bg-slate-50 flex justify-between items-center">
                <h2 class="font-bold">Liste des élèves (<span id="student-count">0</span>)</h2>
            </div>
            <table class="w-full text-left text-sm">
                <thead class="bg-slate-50 text-slate-500 uppercase text-[10px]">
                    <tr>
                        <th class="px-5 py-3">Nom Complet</th>
                        <th class="px-5 py-3 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="students-table-body"></tbody>
            </table>
        </section>
    </main>

    <!-- TOUS LES MODALS (Cachés par défaut) -->
    
    <!-- Modal Inscription -->
    <div id="registration-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md">
            <h3 class="text-lg font-bold mb-4">Nouvel Élève</h3>
            <input type="text" id="reg-firstname" placeholder="Prénom" class="w-full border p-2 rounded-lg mb-2">
            <input type="text" id="reg-lastname" placeholder="Nom" class="w-full border p-2 rounded-lg mb-4">
            <div class="flex justify-end gap-2">
                <button onclick="closeModal('registration-modal')" class="text-slate-500">Annuler</button>
                <button onclick="saveStudent()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg">Enregistrer</button>
            </div>
        </div>
    </div>

    <!-- Modal Tarifs -->
    <div id="fees-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md">
            <h3 class="text-lg font-bold mb-4">Paramètres Financiers</h3>
            <label class="block text-xs font-bold mb-1">Frais d'Inscription</label>
            <input type="number" id="fee-inscription" class="w-full border p-2 rounded-lg mb-2">
            <label class="block text-xs font-bold mb-1">Mensualité</label>
            <input type="number" id="fee-mensualite" class="w-full border p-2 rounded-lg mb-4">
            <button onclick="saveFees()" class="w-full bg-amber-600 text-white py-2 rounded-lg">Appliquer</button>
            <button onclick="closeModal('fees-modal')" class="w-full mt-2 text-slate-500">Fermer</button>
        </div>
    </div>

    <!-- Script Principal -->
    <script>
        const classNames = ["CP", "CE1", "CE2", "CM1", "CM2", "6ème", "5ème", "4ème", "3ème", "Seconde", "Première", "Terminale"];
        let appState = {
            currentYear: "2025-2026",
            currentSemester: 1,
            selectedClass: "6ème",
            selectedSection: "",
            classes: {}
        };

        // --- INITIALISATION ---
        async function initApp() {
            const saved = await idbKeyval.get("gestnotes_state");
            if (saved) appState = saved;
            
            classNames.forEach(c => {
                const sections = getSectionsForClass(c);
                sections.forEach(s => {
                    const key = `${c}_${s}`;
                    if (!appState.classes[key]) {
                        appState.classes[key] = { 
                            students: [], 
                            subjects: [{id: 1, name: "Maths", coef: 2}, {id: 2, name: "Français", coef: 2}],
                            fees: { inscription: 25000, mensualite: 15000 }
                        };
                    }
                });
            });

            populateFilters();
            render();
        }

        function getSectionsForClass(cls) {
            if (["Seconde", "Première", "Terminale"].includes(cls)) return ["L1", "S1", "S2"];
            return ["", "A", "B"];
        }

        function populateFilters() {
            const cSel = document.getElementById('filter-class');
            cSel.innerHTML = classNames.map(c => `<option value="${c}" ${appState.selectedClass === c ? 'selected' : ''}>${c}</option>`).join('');
            updateSectionFilterOptions();
        }

        function updateSectionFilterOptions() {
            const sections = getSectionsForClass(appState.selectedClass);
            const sSel = document.getElementById('filter-section');
            sSel.innerHTML = sections.map(s => `<option value="${s}" ${appState.selectedSection === s ? 'selected' : ''}>${s || 'Général'}</option>`).join('');
            if (!sections.includes(appState.selectedSection)) appState.selectedSection = sections[0];
        }

        // --- ACTIONS ---
        function onClassChange() {
            appState.selectedClass = document.getElementById('filter-class').value;
            updateSectionFilterOptions();
            render();
        }

        function onSectionChange() {
            appState.selectedSection = document.getElementById('filter-section').value;
            render();
        }

        function saveStudent() {
            const fname = document.getElementById('reg-firstname').value;
            const lname = document.getElementById('reg-lastname').value;
            if (!fname || !lname) return;

            const key = `${appState.selectedClass}_${appState.selectedSection}`;
            appState.classes[key].students.push({
                id: Date.now(),
                firstname: fname,
                lastname: lname,
                grades: {},
                payments: []
            });

            saveAndRefresh();
            closeModal('registration-modal');
        }

        function render() {
            const key = `${appState.selectedClass}_${appState.selectedSection}`;
            const cls = appState.classes[key];
            
            // Stats
            let totalEncaisse = 0;
            cls.students.forEach(s => s.payments.forEach(p => totalEncaisse += p.amount));
            document.getElementById('stats-total-encaisse').innerText = totalEncaisse.toLocaleString() + " F";

            // Tableaux
            renderStudentsTable(cls.students);
            renderGradesGrid();
            
            // Select Matières
            document.getElementById('grade-subject-select').innerHTML = cls.subjects.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
        }

        function renderStudentsTable(students) {
            const tbody = document.getElementById('students-table-body');
            tbody.innerHTML = students.map(s => `
                <tr class="border-b">
                    <td class="px-5 py-3 font-bold">${s.firstname} ${s.lastname}</td>
                    <td class="px-5 py-3 text-right">
                        <button onclick="ouvrirBulletin('${s.id}')" class="text-indigo-600 font-bold">Bulletin</button>
                    </td>
                </tr>
            `).join('');
            document.getElementById('student-count').innerText = students.length;
        }

        function renderGradesGrid() {
            const key = `${appState.selectedClass}_${appState.selectedSection}`;
            const cls = appState.classes[key];
            const subId = document.getElementById('grade-subject-select').value;
            const tbody = document.getElementById('grades-table-body');
            if(!subId) return;

            tbody.innerHTML = cls.students.map(s => {
                const g = s.grades[subId] || {dev1:'', dev2:'', compo:''};
                return `
                    <tr>
                        <td class="text-left font-bold">${s.firstname}</td>
                        <td><input type="number" onchange="updateGrade('${s.id}', '${subId}', 'dev1', this.value)" value="${g.dev1}" class="w-10 border text-center"></td>
                        <td><input type="number" onchange="updateGrade('${s.id}', '${subId}', 'dev2', this.value)" value="${g.dev2}" class="w-10 border text-center"></td>
                        <td class="bg-violet-50"><input type="number" onchange="updateGrade('${s.id}', '${subId}', 'compo', this.value)" value="${g.compo}" class="w-10 border text-center font-bold"></td>
                    </tr>
                `;
            }).join('');
        }

        function updateGrade(sid, subid, field, val) {
            const key = `${appState.selectedClass}_${appState.selectedSection}`;
            const student = appState.classes[key].students.find(s => s.id == sid);
            if (!student.grades[subid]) student.grades[subid] = {};
            student.grades[subid][field] = val;
            idbKeyval.set("gestnotes_state", appState);
        }

        // --- UTILITAIRES ---
        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        
        async function saveAndRefresh() {
            await idbKeyval.set("gestnotes_state", appState);
            render();
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(appState)], {type: 'text/plain'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = "sauvegarde_gestnotes.txt";
            a.click();
        }

        window.onload = initApp;
    </script>
</body>
</html>
