<!DOCTYPE html>
<html lang="fr"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#4c1d95">
    <title>GestNotes – Administration scolaire</title>
    
    <!-- Bibliothèques Externes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/idb-keyval@6/dist/umd/idb-keyval-iife.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Hanken Grotesk', sans-serif; background-color: #f8fafc; }
        .grid-table td, .grid-table th { border: 1px solid #e2e8f0; text-align: center; padding: 8px 6px; }
        .modal { transition: opacity 0.25s ease; }
        @media print { .no-print { display: none; } }
    </style>
</head>

<body class="min-h-screen bg-slate-50 flex flex-col text-slate-800">

    <!-- HEADER -->
    <header class="bg-[#4c1d95] text-white shadow-md px-4 py-3 md:px-6 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-40 no-print">
        <div class="flex items-center gap-3">
            <div class="bg-white/10 p-2 rounded-lg"><i class="fas fa-graduation-cap text-2xl text-violet-200"></i></div>
            <div>
                <h1 class="text-xl font-bold tracking-tight">GestNotes</h1>
                <p class="text-xs text-violet-200">Admin & Gestion</p>
            </div>
        </div>

        <div class="flex items-center gap-3 ml-auto">
            <select id="role-selector" onchange="onRoleChange()" class="bg-violet-950 text-white border border-violet-800 rounded-xl text-xs px-2 py-2 outline-none font-semibold">
                <option value="admin">👑 Admin</option>
                <option value="comptable">💼 Comptable</option>
                <option value="enseignant">📝 Enseignant</option>
            </select>
            <div class="bg-violet-950/50 rounded-xl p-1 flex border border-violet-800/50 text-xs">
                <div class="px-2 py-1.5 font-medium text-violet-200" id="display-year">2025-2026</div>
                <div class="bg-[#6d28d9] px-2 py-1.5 rounded-lg font-semibold" id="display-semester">S1</div>
            </div>
            <button onclick="openModal('settings-modal')" class="p-2 hover:bg-white/10 rounded-xl"><i class="fas fa-cog"></i></button>
        </div>
    </header>

    <main class="flex-1 p-4 md:p-6 max-w-[1400px] mx-auto w-full flex flex-col gap-6">
        
        <!-- BARRE D'ACTIONS -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 no-print">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                <button onclick="exportData()" class="bg-green-600 text-white py-2 px-4 rounded-xl text-sm font-bold hover:bg-green-700"><i class="fas fa-download mr-2"></i>Exporter</button>
                <button onclick="document.getElementById('importFile').click()" class="bg-blue-600 text-white py-2 px-4 rounded-xl text-sm font-bold hover:bg-blue-700"><i class="fas fa-upload mr-2"></i>Importer</button>
                <input type="file" id="importFile" accept=".txt" class="hidden" onchange="importData(event)">
                <button onclick="sauvegarderSurDrive()" class="bg-violet-600 text-white py-2 px-4 rounded-xl text-sm font-bold"><i class="fab fa-google-drive mr-2"></i><span id="lbl-gdrive-sync">Synchro</span></button>
                <button id="btn-add-student-top" onclick="openRegistrationModal()" class="bg-slate-900 text-white py-2 px-4 rounded-xl text-sm font-bold"><i class="fas fa-plus mr-2"></i>Inscription</button>
            </div>
        </div>

        <!-- FILTRES -->
        <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex flex-wrap gap-4 items-end no-print">
            <div class="flex-1 min-w-[150px]">
                <label class="block text-xs font-bold text-slate-500 mb-1">Classe</label>
                <select id="filter-class" onchange="onClassChange()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm font-bold"></select>
            </div>
            <div class="flex-1 min-w-[150px]">
                <label class="block text-xs font-bold text-slate-500 mb-1">Série / Option</label>
                <select id="filter-section" onchange="onSectionChange()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm font-bold"></select>
            </div>
            <div class="flex gap-2">
                <button id="btn-manage-subjects" onclick="openSubjectsModal()" class="bg-violet-50 text-[#4c1d95] px-4 py-2 rounded-xl text-xs font-bold border border-violet-100"><i class="fas fa-book mr-1"></i> Matières</button>
                <button id="btn-class-fees" onclick="openClassFeesModal()" class="bg-amber-50 text-amber-700 px-4 py-2 rounded-xl text-xs font-bold border border-amber-100"><i class="fas fa-coins mr-1"></i> Tarifs</button>
            </div>
        </section>

        <!-- STATS FINANCIÈRES (ADMIN/COMPTABLE) -->
        <section id="class-stats-section" class="grid grid-cols-2 lg:grid-cols-4 gap-4 no-print">
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                <p class="text-[10px] uppercase font-bold text-slate-400">Attendu</p>
                <p class="text-xl font-bold text-slate-800" id="stats-total-attendu">0 F</p>
            </div>
            <div class="bg-white p-4 rounded-2xl border-l-4 border-l-emerald-500 shadow-sm">
                <p class="text-[10px] uppercase font-bold text-emerald-600">Encaissé</p>
                <p class="text-xl font-bold text-emerald-700" id="stats-total-encaisse">0 F</p>
            </div>
            <div class="bg-white p-4 rounded-2xl border-l-4 border-l-rose-500 shadow-sm">
                <p class="text-[10px] uppercase font-bold text-rose-600">Reste</p>
                <p class="text-xl font-bold text-rose-700" id="stats-reste-recouvrer">0 F</p>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                <p class="text-[10px] uppercase font-bold text-violet-600">Recouvrement</p>
                <p class="text-xl font-bold text-violet-700" id="stats-taux-recouvrement">0%</p>
            </div>
        </section>

        <!-- GRILLE DE NOTES -->
        <section id="grades-section" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 no-print">
            <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
                <h3 class="font-bold text-slate-700"><i class="fas fa-edit text-[#4c1d95] mr-2"></i>Saisie des Notes</h3>
                <div class="flex items-center gap-2">
                    <select id="grade-subject-select" onchange="renderGradesGrid()" class="bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm font-bold"></select>
                    <input type="text" id="grade-search" oninput="filterGrades()" placeholder="Rechercher..." class="bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm">
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-xs grid-table">
                    <thead class="bg-slate-100">
                        <tr>
                            <th class="text-left">Élève</th>
                            <th>Devoir 1</th>
                            <th>Devoir 2</th>
                            <th class="bg-violet-50">Composition</th>
                        </tr>
                    </thead>
                    <tbody id="grades-table-body"></tbody>
                </table>
            </div>
        </section>

        <!-- LISTE DES ÉLÈVES -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden no-print">
            <div class="p-5 border-b bg-slate-50/50 flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-800">Registre des élèves <span id="student-count" class="text-xs font-normal text-slate-500 ml-2"></span></h2>
                <button onclick="generateAllBulletins()" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold"><i class="fas fa-print mr-1"></i> Tous les Bulletins</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-50 text-slate-500 uppercase text-[10px] font-bold">
                        <tr>
                            <th class="px-5 py-3">Nom de l'élève</th>
                            <th class="px-5 py-3 text-center">Sexe</th>
                            <th class="px-5 py-3 text-center">Scolarité</th>
                            <th class="px-5 py-3 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="students-table-body" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- MODAL INSCRIPTION -->
    <div id="registration-modal" class="hidden fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6">
            <h3 class="text-xl font-bold mb-4">Nouvelle Inscription</h3>
            <div class="grid grid-cols-2 gap-4">
                <div class="col-span-2">
                    <label class="block text-xs font-bold mb-1">Prénom</label>
                    <input type="text" id="reg-firstname" class="w-full border rounded-xl p-2.5">
                </div>
                <div class="col-span-2">
                    <label class="block text-xs font-bold mb-1">Nom</label>
                    <input type="text" id="reg-lastname" class="w-full border rounded-xl p-2.5">
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">Sexe</label>
                    <select id="reg-gender" class="w-full border rounded-xl p-2.5">
                        <option value="M">Masculin (M)</option>
                        <option value="F">Féminin (F)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">Date de Naissance</label>
                    <input type="date" id="reg-dob" class="w-full border rounded-xl p-2.5">
                </div>
            </div>
            <div class="mt-6 flex justify-end gap-3">
                <button onclick="closeModal('registration-modal')" class="px-4 py-2 text-slate-500 font-bold">Annuler</button>
                <button onclick="saveStudent()" class="bg-[#4c1d95] text-white px-6 py-2 rounded-xl font-bold">Inscrire</button>
            </div>
        </div>
    </div>

    <!-- MODAL PAIEMENT -->
    <div id="payment-modal" class="hidden fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6">
            <h3 class="text-xl font-bold mb-2">Encaisser un paiement</h3>
            <p id="payment-student-name" class="text-sm text-indigo-600 font-bold mb-4"></p>
            <div class="space-y-4">
                <select id="pay-month" class="w-full border rounded-xl p-2.5 font-bold"></select>
                <input type="number" id="pay-amount" placeholder="Montant en FCFA" class="w-full border rounded-xl p-2.5 text-lg font-bold">
            </div>
            <div class="mt-6 flex justify-end gap-3">
                <button onclick="closeModal('payment-modal')" class="px-4 py-2 text-slate-500 font-bold">Annuler</button>
                <button onclick="confirmPayment()" class="bg-emerald-600 text-white px-6 py-2 rounded-xl font-bold">Valider Reçu</button>
            </div>
        </div>
    </div>

    <!-- ZONE D'IMPRESSION CACHÉE -->
    <div id="print-area" class="hidden"></div>

<script>
    // --- ÉTAT ET CONFIGURATION ---
    const classNames = ["CP", "CE1", "CE2", "CM1", "CM2", "6ème", "5ème", "4ème", "3ème", "Seconde", "Première", "Terminale"];
    const months = ["Inscription", "Octobre", "Novembre", "Décembre", "Janvier", "Février", "Mars", "Avril", "Mai", "Juin"];
    
    let appState = {
        currentYear: "2025-2026",
        currentSemester: 1,
        selectedClass: "6ème",
        selectedSection: "",
        currentRole: "admin",
        googleSyncUrl: "",
        classes: {}
    };

    // --- INITIALISATION ---
    async function initApp() {
        const saved = await idbKeyval.get("gestnotes_db");
        if (saved) appState = saved;
        
        // Création des structures de classes si vides
        classNames.forEach(c => {
            ["", "A", "B", "L1", "L2", "S1", "S2"].forEach(s => {
                const key = `${c}_${s}`;
                if (!appState.classes[key]) {
                    appState.classes[key] = { 
                        students: [], 
                        subjects: [{id: Date.now(), name: 'Mathématiques', coef: 2, teacherName: ''}],
                        fees: { inscription: 25000, mensualite: 15000 }
                    };
                }
            });
        });

        populateFilters();
        updateUI();
    }

    function updateUI() {
        document.getElementById('display-year').innerText = appState.currentYear;
        document.getElementById('display-semester').innerText = "Semestre " + appState.currentSemester;
        renderStudents();
        renderGradesGrid();
        renderStats();
        applyRoleRestrictions();
    }

    // --- GESTION DES RÔLES ---
    function onRoleChange() {
        appState.currentRole = document.getElementById('role-selector').value;
        if (appState.currentRole !== 'enseignant') {
            const pass = prompt("Code d'accès :");
            if (pass !== "1234") {
                alert("Accès refusé");
                document.getElementById('role-selector').value = "enseignant";
                appState.currentRole = "enseignant";
            }
        }
        updateUI();
    }

    function applyRoleRestrictions() {
        const role = appState.currentRole;
        document.getElementById('class-stats-section').style.display = (role === 'enseignant') ? 'none' : 'grid';
        document.getElementById('btn-manage-subjects').style.display = (role === 'enseignant') ? 'none' : 'block';
        document.getElementById('btn-class-fees').style.display = (role === 'enseignant') ? 'none' : 'block';
    }

    // --- FILTRES ---
    function populateFilters() {
        const classSelect = document.getElementById('filter-class');
        classSelect.innerHTML = classNames.map(c => `<option value="${c}">${c}</option>`).join('');
        classSelect.value = appState.selectedClass;
        updateSectionOptions();
    }

    function updateSectionOptions() {
        const sections = ["", "A", "B", "C"];
        const secSelect = document.getElementById('filter-section');
        secSelect.innerHTML = sections.map(s => `<option value="${s}">${s || 'Standard'}</option>`).join('');
    }

    function onClassChange() {
        appState.selectedClass = document.getElementById('filter-class').value;
        updateUI();
    }

    function onSectionChange() {
        appState.selectedSection = document.getElementById('filter-section').value;
        updateUI();
    }

    // --- ÉLÈVES ---
    function openRegistrationModal() { openModal('registration-modal'); }

    function saveStudent() {
        const fname = document.getElementById('reg-firstname').value;
        const lname = document.getElementById('reg-lastname').value;
        if (!fname || !lname) return alert("Remplissez les noms");

        const key = `${appState.selectedClass}_${appState.selectedSection}`;
        const newStudent = {
            id: 'STD' + Date.now(),
            firstname: fname,
            lastname: lname,
            gender: document.getElementById('reg-gender').value,
            dob: document.getElementById('reg-dob').value,
            payments: [],
            grades: {} // Structure: { semestre: { matiereId: { dev1, dev2, compo } } }
        };

        appState.classes[key].students.push(newStudent);
        saveAndRefresh();
        closeModal('registration-modal');
    }

    function renderStudents() {
        const key = `${appState.selectedClass}_${appState.selectedSection}`;
        const students = appState.classes[key].students;
        const tbody = document.getElementById('students-table-body');
        document.getElementById('student-count').innerText = `${students.length} élèves`;

        tbody.innerHTML = students.map(s => {
            const paid = s.payments.reduce((sum, p) => sum + p.amount, 0);
            return `
            <tr>
                <td class="px-5 py-3 font-bold">${s.firstname} ${s.lastname.toUpperCase()}</td>
                <td class="px-5 py-3 text-center">${s.gender}</td>
                <td class="px-5 py-3 text-center">
                    <span class="text-[10px] font-bold ${paid > 0 ? 'text-emerald-600' : 'text-slate-400'}">${paid.toLocaleString()} F</span>
                </td>
                <td class="px-5 py-3 text-right space-x-2">
                    <button onclick="openPaymentModal('${s.id}')" class="text-emerald-600 hover:underline">Payer</button>
                    <button onclick="generateBulletin('${s.id}')" class="text-indigo-600 hover:underline">Bulletin</button>
                    <button onclick="deleteStudent('${s.id}')" class="text-rose-600"><i class="fas fa-trash"></i></button>
                </td>
            </tr>`;
        }).join('');
    }

    // --- NOTES ---
    function renderGradesGrid() {
        const key = `${appState.selectedClass}_${appState.selectedSection}`;
        const cls = appState.classes[key];
        const subSelect = document.getElementById('grade-subject-select');
        
        // Charger les matières dans le select
        subSelect.innerHTML = cls.subjects.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
        
        const subId = subSelect.value;
        const tbody = document.getElementById('grades-table-body');
        if (!subId) { tbody.innerHTML = "<tr><td colspan='4'>Aucune matière</td></tr>"; return; }

        tbody.innerHTML = cls.students.map(s => {
            const g = s.grades?.[appState.currentSemester]?.[subId] || {dev1:'', dev2:'', compo:''};
            return `
            <tr>
                <td class="text-left font-bold px-2">${s.firstname} ${s.lastname}</td>
                <td><input type="number" step="0.25" onchange="updateGrade('${s.id}','${subId}','dev1',this.value)" value="${g.dev1}" class="w-full text-center outline-none"></td>
                <td><input type="number" step="0.25" onchange="updateGrade('${s.id}','${subId}','dev2',this.value)" value="${g.dev2}" class="w-full text-center outline-none"></td>
                <td class="bg-violet-50"><input type="number" step="0.25" onchange="updateGrade('${s.id}','${subId}','compo',this.value)" value="${g.compo}" class="w-full text-center font-bold outline-none"></td>
            </tr>`;
        }).join('');
    }

    function updateGrade(sid, subid, field, val) {
        const key = `${appState.selectedClass}_${appState.selectedSection}`;
        const student = appState.classes[key].students.find(s => s.id === sid);
        
        if (!student.grades[appState.currentSemester]) student.grades[appState.currentSemester] = {};
        if (!student.grades[appState.currentSemester][subid]) student.grades[appState.currentSemester][subid] = {};
        
        student.grades[appState.currentSemester][subid][field] = val;
        saveToStorage();
    }

    // --- COMPTABILITÉ ---
    let currentStudentPaying = null;
    function openPaymentModal(sid) {
        currentStudentPaying = sid;
        const key = `${appState.selectedClass}_${appState.selectedSection}`;
        const student = appState.classes[key].students.find(s => s.id === sid);
        document.getElementById('payment-student-name').innerText = student.firstname + " " + student.lastname;
        
        const monthSelect = document.getElementById('pay-month');
        monthSelect.innerHTML = months.map(m => `<option value="${m}">${m}</option>`).join('');
        
        openModal('payment-modal');
    }

    function confirmPayment() {
        const amount = parseInt(document.getElementById('pay-amount').value);
        if (!amount) return;

        const key = `${appState.selectedClass}_${appState.selectedSection}`;
        const student = appState.classes[key].students.find(s => s.id === currentStudentPaying);
        
        student.payments.push({
            date: new Date().toLocaleDateString(),
            month: document.getElementById('pay-month').value,
            amount: amount
        });

        saveAndRefresh();
        closeModal('payment-modal');
        alert("Paiement enregistré !");
    }

    function renderStats() {
        const key = `${appState.selectedClass}_${appState.selectedSection}`;
        const cls = appState.classes[key];
        const effectif = cls.students.length;
        
        const attendu = effectif * (cls.fees.inscription + (cls.fees.mensualite * 9));
        let encaisse = 0;
        cls.students.forEach(s => {
            s.payments.forEach(p => encaisse += p.amount);
        });

        document.getElementById('stats-total-attendu').innerText = attendu.toLocaleString() + " F";
        document.getElementById('stats-total-encaisse').innerText = encaisse.toLocaleString() + " F";
        document.getElementById('stats-reste-recouvrer').innerText = (attendu - encaisse).toLocaleString() + " F";
        document.getElementById('stats-taux-recouvrement').innerText = attendu > 0 ? Math.round((encaisse/attendu)*100) + "%" : "0%";
    }

    // --- BULLETINS (PDF) ---
    function generateBulletin(sid) {
        const key = `${appState.selectedClass}_${appState.selectedSection}`;
        const cls = appState.classes[key];
        const student = cls.students.find(s => s.id === sid);
        
        let html = `
            <div style="padding: 40px; font-family: sans-serif;">
                <div style="display: flex; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 10px;">
                    <div><strong>ÉCOLE GESTNOTES</strong><br>Année Scolaire: ${appState.currentYear}</div>
                    <div style="text-align: right;"><strong>BULLETIN DE NOTES</strong><br>Semestre ${appState.currentSemester}</div>
                </div>
                <div style="margin: 20px 0;">
                    <strong>NOM :</strong> ${student.lastname.toUpperCase()}<br>
                    <strong>PRÉNOM :</strong> ${student.firstname}<br>
                    <strong>CLASSE :</strong> ${appState.selectedClass} ${appState.selectedSection}
                </div>
                <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
                    <thead>
                        <tr style="background: #f1f1f1;">
                            <th style="border: 1px solid #000; padding: 8px;">Matières</th>
                            <th style="border: 1px solid #000; padding: 8px;">Coef</th>
                            <th style="border: 1px solid #000; padding: 8px;">Moy. Classe</th>
                            <th style="border: 1px solid #000; padding: 8px;">Moyenne</th>
                            <th style="border: 1px solid #000; padding: 8px;">Moy. Pondérée</th>
                        </tr>
                    </thead>
                    <tbody>`;
        
        let totalPondere = 0;
        let totalCoef = 0;

        cls.subjects.forEach(sub => {
            const g = student.grades?.[appState.currentSemester]?.[sub.id] || {dev1:0, dev2:0, compo:0};
            const moy = ( (parseFloat(g.dev1||0) + parseFloat(g.dev2||0))/2 + parseFloat(g.compo||0) ) / 2;
            const pond = moy * sub.coef;
            totalPondere += pond;
            totalCoef += sub.coef;

            html += `
                <tr>
                    <td style="border: 1px solid #000; padding: 8px;">${sub.name}</td>
                    <td style="border: 1px solid #000; padding: 8px; text-align: center;">${sub.coef}</td>
                    <td style="border: 1px solid #000; padding: 8px; text-align: center;">-</td>
                    <td style="border: 1px solid #000; padding: 8px; text-align: center;">${moy.toFixed(2)}</td>
                    <td style="border: 1px solid #000; padding: 8px; text-align: center;">${pond.toFixed(2)}</td>
                </tr>`;
        });

        const genAvg = totalPondere / totalCoef;

        html += `
                    </tbody>
                </table>
                <div style="margin-top: 30px; text-align: right;">
                    <p style="font-size: 1.2rem;"><strong>MOYENNE GÉNÉRALE : ${genAvg.toFixed(2)} / 20</strong></p>
                </div>
            </div>`;

        const opt = { margin: 0, filename: `Bulletin_${student.lastname}.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' } };
        html2pdf().set(opt).from(html).save();
    }

    // --- UTILS ---
    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    async function saveToStorage() {
        await idbKeyval.set("gestnotes_db", appState);
    }

    function saveAndRefresh() {
        saveToStorage();
        updateUI();
    }

    function exportData() {
        const data = JSON.stringify(appState);
        const blob = new Blob([data], {type: 'text/plain'});
        const anchor = document.createElement('a');
        anchor.href = window.URL.createObjectURL(blob);
        anchor.download = `GESTNOTES_SAUVEGARDE_${new Date().toLocaleDateString()}.txt`;
        anchor.click();
    }

    function importData(event) {
        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                const imported = JSON.parse(e.target.result);
                appState = imported;
                await saveAndRefresh();
                alert("Données importées avec succès !");
            } catch (err) { alert("Fichier invalide"); }
        };
        reader.readAsText(event.target.files[0]);
    }

    window.onload = initApp;

</script>
</body>
</html>
