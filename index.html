  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone pour exécuter React JSX directement -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap');
    body {

      background-color: #f8fafc;
    }
    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- DONNÉES PAR DÉFAUT DU SYSTÈME ---
    const DEFAULT_CONFIG = {
      schoolName: "Lycée d'Excellence Cheikh Hamidou Kane",
      academicYear: "2025 - 2026",
      term: "1er Trimestre",
      headmaster: "M. Ibrahima SARR",
      address: "Point E, Avenue Cheikh Anta Diop, Dakar",
      email: "contact@excellence-dakar.sn",
      phone: "+221 33 824 10 20",
      schoolFeesAmount: 50000
    };

    const DEFAULT_SUBJECTS = {
      Seconde: [
        { id: 'math', name: 'Mathématiques', coef: 4 },
        { id: 'pc', name: 'Physique-Chimie', coef: 3 },
        { id: 'fr', name: 'Français', coef: 3 },

      ],
      Premiere: [
        { id: 'math', name: 'Mathématiques', coef: 5 },
        { id: 'pc', name: 'Physique-Chimie', coef: 4 },
        { id: 'fr', name: 'Français', coef: 3 },
        { id: 'ang', name: 'Anglais', coef: 2 },
        { id: 'philo', name: 'Philosophie', coef: 2 }
      ],
      Terminale: [
        { id: 'math', name: 'Mathématiques', coef: 6 },
        { id: 'pc', name: 'Physique-Chimie', coef: 5 },
        { id: 'philo', name: 'Philosophie', coef: 3 },
        { id: 'ang', name: 'Anglais', coef: 2 },
        { id: 'svt', name: 'SVT', coef: 2 }
      ]
    };

    const DEFAULT_STUDENTS = {
      Seconde: [
        { id: '1', mat: 'MAT-001', lastName: 'DIALLO', firstName: 'Moussa', sex: 'M', birthDate: '2008-04-12', phone: '+221 77 123 45 67', paidFees: 45000 },
        { id: '2', mat: 'MAT-002', lastName: 'NDIAYE', firstName: 'Fatou', sex: 'F', birthDate: '2008-09-21', phone: '+221 77 987 65 43', paidFees: 50000 },
        { id: '3', mat: 'MAT-003', lastName: 'SOW', firstName: 'Amadou', sex: 'M', birthDate: '2007-11-05', phone: '+221 76 543 21 09', paidFees: 25000 },
        { id: '4', mat: 'MAT-004', lastName: 'BA', firstName: 'Aïssatou', sex: 'F', birthDate: '2008-02-18', phone: '+221 70 888 99 00', paidFees: 50000 }
      ],
      Premiere: [
        { id: '10', mat: 'MAT-101', lastName: 'FALL', firstName: 'Cheikh', sex: 'M', birthDate: '2007-05-10', phone: '+221 77 444 33 22', paidFees: 50000 },
        { id: '11', mat: 'MAT-102', lastName: 'KANE', firstName: 'Mariama', sex: 'F', birthDate: '2007-12-03', phone: '+221 78 555 66 77', paidFees: 30000 }
      ],
      Terminale: [
        { id: '20', mat: 'MAT-201', lastName: 'TRAORE', firstName: 'Ousmane', sex: 'M', birthDate: '2006-03-25', phone: '+221 77 222 11 00', paidFees: 50000 }
      ]
    };

    const DEFAULT_GRADES = {
      '1': { math: { d1: 14, d2: 15, compo: 13.5 }, pc: { d1: 12, d2: 14, compo: 13 }, fr: { d1: 11, d2: 12, compo: 10 } },
      '2': { math: { d1: 18, d2: 17.5, compo: 19 }, pc: { d1: 16, d2: 17, compo: 18 }, fr: { d1: 15, d2: 14, compo: 16 } },
      '3': { math: { d1: 9, d2: 10, compo: 8.5 }, pc: { d1: 11, d2: 10, compo: 9 }, fr: { d1: 12, d2: 13, compo: 12 } },
      '4': { math: { d1: 13, d2: 12, compo: 14 }, pc: { d1: 14, d2: 15, compo: 13.5 }, fr: { d1: 16, d2: 15.5, compo: 15 } },
      '10': { math: { d1: 15, d2: 16, compo: 15.5 }, pc: { d1: 14, d2: 15, compo: 14 } },
      '11': { math: { d1: 12, d2: 11, compo: 13 }, pc: { d1: 10, d2: 12, compo: 11 } },
      '20': { math: { d1: 16, d2: 15, compo: 17 }, pc: { d1: 15, d2: 16, compo: 15.5 } }
    };

    const DEFAULT_ASSIGNMENTS = [
      { id: 'asg-1', title: 'Devoir n°1 : Fonctions et Polynômes', classKey: 'Seconde', subjectId: 'math', subjectName: 'Mathématiques', teacherName: 'M. Diop', dueDate: '2026-09-15', maxGrade: 20 },
      { id: 'asg-2', title: 'Devoir n°1 : Cinématique & Forces', classKey: 'Seconde', subjectId: 'pc', subjectName: 'Physique-Chimie', teacherName: 'Mme Faye', dueDate: '2026-09-18', maxGrade: 20 }
    ];

    const DEFAULT_SUBMISSIONS = [
      { id: 'sub-1', assignmentId: 'asg-1', assignmentTitle: 'Devoir n°1 : Fonctions et Polynômes', classKey: 'Seconde', subjectId: 'math', studentId: '2', studentName: 'NDIAYE Fatou', studentMatricule: 'MAT-002', submittedAt: '2026-09-06T14:30:00Z', fileName: 'MAT-002_Fatou_NDIAYE_Devoir1.pdf', folderPath: 'Mathématiques - M. Diop > Devoir n°1 : Fonctions et Polynômes', targetSubfolder: 'Devoir n°1 : Fonctions et Polynômes', grade: 18.5, teacherFeedback: 'Excellent travail, raisonnement parfait !', status: 'corrigé' },
      { id: 'sub-2', assignmentId: 'asg-1', assignmentTitle: 'Devoir n°1 : Fonctions et Polynômes', classKey: 'Seconde', subjectId: 'math', studentId: '1', studentName: 'DIALLO Moussa', studentMatricule: 'MAT-001', submittedAt: '2026-09-07T09:15:00Z', fileName: 'MAT-001_Moussa_DIALLO_Devoir1.pdf', folderPath: 'Mathématiques - M. Diop > Devoir n°1 : Fonctions et Polynômes', targetSubfolder: 'Devoir n°1 : Fonctions et Polynômes', status: 'reçu' }
    ];

    function App() {
      // États principaux
      const [currentClass, setCurrentClass] = useState('Seconde');
      const [activeTab, setActiveTab] = useState('grades'); // 'grades' | 'students' | 'homework' | 'drive_sync' | 'bulletins'
      const [studentsData, setStudentsData] = useState(() => {
        const saved = localStorage.getItem('gestnotes_students');
        return saved ? JSON.parse(saved) : DEFAULT_STUDENTS;
      });
      const [gradesData, setGradesData] = useState(() => {
        const saved = localStorage.getItem('gestnotes_grades');
        return saved ? JSON.parse(saved) : DEFAULT_GRADES;
      });
      const [assignments, setAssignments] = useState(() => {
        const saved = localStorage.getItem('gestnotes_assignments');
        return saved ? JSON.parse(saved) : DEFAULT_ASSIGNMENTS;
      });
      const [submissions, setSubmissions] = useState(() => {
        const saved = localStorage.getItem('gestnotes_submissions');
        return saved ? JSON.parse(saved) : DEFAULT_SUBMISSIONS;
      });
      const [config, setConfig] = useState(() => {
        const saved = localStorage.getItem('gestnotes_config');
        return saved ? JSON.parse(saved) : DEFAULT_CONFIG;
      });
      const [scriptUrl, setScriptUrl] = useState(() => {
        return localStorage.getItem('gestnotes_script_url') || '';
      });

      // Config du dossier enseignant Drive
      const [teacherDriveConfig, setTeacherDriveConfig] = useState({
        teacherName: 'M. Diop',
        subjectName: 'Mathématiques',
        folderName: 'Mathématiques - M. Diop (Seconde)',
        folderUrl: 'https://drive.google.com/drive/folders/GestNotes_Devoirs_Seconde_Math',
        organizationMode: 'by_assignment', // 'by_assignment' | 'by_student' | 'by_date' | 'flat'
        fileNamingFormat: 'mat_name_asg',
        includeRegisterLog: true
      });

      // Modales & états d'interaction
      const [isStudentModalOpen, setIsStudentModalOpen] = useState(false);
      const [isSubmitModalOpen, setIsSubmitModalOpen] = useState(false);
      const [isConfigModalOpen, setIsConfigModalOpen] = useState(false);
      const [editingStudent, setEditingStudent] = useState(null);
      const [selectedBulletinStudent, setSelectedBulletinStudent] = useState(null);
      const [toast, setToast] = useState(null);

      // Sauvegardes locales automatiques
      useEffect(() => {
        localStorage.setItem('gestnotes_students', JSON.stringify(studentsData));
        localStorage.setItem('gestnotes_grades', JSON.stringify(gradesData));
        localStorage.setItem('gestnotes_assignments', JSON.stringify(assignments));
        localStorage.setItem('gestnotes_submissions', JSON.stringify(submissions));
        localStorage.setItem('gestnotes_config', JSON.stringify(config));
        localStorage.setItem('gestnotes_script_url', scriptUrl);
      }, [studentsData, gradesData, assignments, submissions, config, scriptUrl]);

      const currentStudents = studentsData[currentClass] || [];
      const currentSubjects = DEFAULT_SUBJECTS[currentClass] || [];

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      // Calcul des moyennes par matière et générales
      const studentCalculations = useMemo(() => {
        const results = {};
        currentStudents.forEach(st => {
          let totalPts = 0;
          let totalCoef = 0;
          const subDetails = {};

          currentSubjects.forEach(sub => {
            const gr = gradesData[st.id]?.[sub.id] || {};
            const d1 = gr.d1;
            const d2 = gr.d2;
            const compo = gr.compo;

            let subAvg = null;
            if (compo !== undefined && compo !== null && compo !== '') {
              const dAvg = (d1 !== undefined && d2 !== undefined && d1 !== '' && d2 !== '') 
                ? (Number(d1) + Number(d2)) / 2 
                : (Number(d1) || Number(d2) || Number(compo));
              subAvg = Number(((dAvg + Number(compo) * 2) / 3).toFixed(2));
              totalPts += subAvg * sub.coef;
              totalCoef += sub.coef;
            }

            subDetails[sub.id] = { d1, d2, compo, avg: subAvg };
          });

          const genAvg = totalCoef > 0 ? Number((totalPts / totalCoef).toFixed(2)) : null;
          results[st.id] = { genAvg, subDetails, totalPts, totalCoef };
        });

        // Calcul des rangs
        const sorted = Object.entries(results)
          .filter(([_, data]) => data.genAvg !== null)
          .sort((a, b) => b[1].genAvg - a[1].genAvg);

        sorted.forEach(([stId], index) => {
          results[stId].rank = index + 1;
        });

        return results;
      }, [currentStudents, currentSubjects, gradesData]);

      // Gestion des notes
      const handleGradeChange = (studentId, subjectId, field, value) => {
        const numVal = value === '' ? '' : Math.min(20, Math.max(0, parseFloat(value) || 0));
        setGradesData(prev => ({
          ...prev,
          [studentId]: {
            ...(prev[studentId] || {}),
            [subjectId]: {
              ...(prev[studentId]?.[subjectId] || {}),
              [field]: numVal
            }
          }
        }));
      };

      // Inscription / Modification d'un élève
      const handleSaveStudent = (e) => {
        e.preventDefault();
        const form = e.target;
        const studentId = editingStudent ? editingStudent.id : `st_${Date.now()}`;
        const newStudent = {
          id: studentId,
          mat: form.mat.value.trim(),
          lastName: form.lastName.value.trim().toUpperCase(),
          firstName: form.firstName.value.trim(),
          sex: form.sex.value,
          birthDate: form.birthDate.value,
          phone: form.phone.value.trim(),
          paidFees: Number(form.paidFees.value) || 0
        };

        setStudentsData(prev => {
          const list = prev[currentClass] || [];
          if (editingStudent) {
            return { ...prev, [currentClass]: list.map(s => s.id === editingStudent.id ? newStudent : s) };
          }
          return { ...prev, [currentClass]: [...list, newStudent] };
        });

        setIsStudentModalOpen(false);
        setEditingStudent(null);
        showToast(editingStudent ? "Élève modifié avec succès" : "Nouvel élève inscrit !");
      };

      // Soumission d'un devoir d'élève
      const handleStudentSubmit = (e) => {
        e.preventDefault();
        const form = e.target;
        const stId = form.studentId.value;
        const asgId = form.assignmentId.value;
        const student = currentStudents.find(s => s.id === stId);
        const assignment = assignments.find(a => a.id === asgId);
        if (!student || !assignment) return;

        let targetSubfolder = "/";
        if (teacherDriveConfig.organizationMode === 'by_assignment') {
          targetSubfolder = assignment.title;
        } else if (teacherDriveConfig.organizationMode === 'by_student') {
          targetSubfolder = `${student.lastName} ${student.firstName} (${student.mat})`;
        } else if (teacherDriveConfig.organizationMode === 'by_date') {
          targetSubfolder = new Date().toISOString().slice(0, 10);
        }

        const formattedFileName = `${student.mat}_${student.lastName}_${assignment.title.replace(/\s+/g, '_')}.pdf`;
        const folderPath = `${teacherDriveConfig.folderName}${targetSubfolder !== '/' ? ' > ' + targetSubfolder : ''}`;

        const newSubmission = {
          id: `sub_${Date.now()}`,
          assignmentId: assignment.id,
          assignmentTitle: assignment.title,
          classKey: currentClass,
          subjectId: assignment.subjectId,
          studentId: student.id,
          studentName: `${student.lastName} ${student.firstName}`,
          studentMatricule: student.mat,
          submittedAt: new Date().toISOString(),
          fileName: formattedFileName,
          folderPath: folderPath,
          targetSubfolder: targetSubfolder,
          studentComment: form.comment.value || '',
          fileDriveUrl: `https://drive.google.com/file/d/devoir_${student.mat}_${Date.now()}/view`,
          status: 'reçu'
        };

        setSubmissions(prev => [newSubmission, ...prev]);
        setIsSubmitModalOpen(false);
        showToast(`Devoir soumis et classé dans : [${folderPath}]`);
      };

      // Notation d'une soumission
      const handleGradeSubmission = (subId, gradeVal, feedback, autoInject) => {
        const sub = submissions.find(s => s.id === subId);
        if (!sub) return;

        setSubmissions(prev => prev.map(s => s.id === subId ? {
          ...s,
          grade: Number(gradeVal),
          teacherFeedback: feedback,
          status: 'corrigé'
        } : s));

        if (autoInject && sub.studentId && sub.subjectId) {
          setGradesData(prev => ({
            ...prev,
            [sub.studentId]: {
              ...(prev[sub.studentId] || {}),
              [sub.subjectId]: {
                ...(prev[sub.studentId]?.[sub.subjectId] || {}),
                d1: Number(gradeVal)
              }
            }
          }));
          showToast(`Note ${gradeVal}/20 validée et reportée dans le carnet !`);
        } else {
          showToast(`Note ${gradeVal}/20 enregistrée !`);
        }
      };

      return (
        <div className="flex flex-col min-h-screen">
          {/* Toast Notification */}
          {toast && (
            <div className="fixed bottom-5 right-5 z-50 bg-slate-900 text-white text-xs font-bold px-4 py-3 rounded-2xl shadow-2xl border border-slate-700 flex items-center gap-2 animate-bounce">
              <span className="text-emerald-400 font-black">✓</span>
              <span>{toast}</span>
            </div>
          )}

          {/* En-tête Principal */}
          <header className="bg-slate-900 text-white sticky top-0 z-40 border-b border-slate-800 shadow-md">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-indigo-500 text-white flex items-center justify-center font-black text-sm shadow-md">
                  G
                </div>
                <div>
                  <h1 className="font-extrabold text-sm sm:text-base tracking-tight leading-none">GestNotes Pro</h1>
                  <p className="text-[10px] text-slate-400 font-medium mt-0.5">{config.schoolName}</p>
                </div>
              </div>

              {/* Sélecteur de Classe & Navigation */}
              <div className="flex items-center gap-3">
                <select
                  value={currentClass}
                  onChange={(e) => setCurrentClass(e.target.value)}
                  className="bg-slate-800 text-slate-200 text-xs font-bold px-3 py-1.5 rounded-xl border border-slate-700 outline-none cursor-pointer"
                >
                  <option value="Seconde">Classe : Seconde S</option>
                  <option value="Premiere">Classe : Première S</option>
                  <option value="Terminale">Classe : Terminale S</option>
                </select>

                <div className="hidden md:flex items-center gap-1 bg-slate-800/90 p-1 rounded-xl border border-slate-700">
                  <button
                    onClick={() => setActiveTab('grades')}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${activeTab === 'grades' ? 'bg-indigo-600 text-white shadow-xs' : 'text-slate-400 hover:text-white'}`}
                  >
                    Carnet de Notes
                  </button>
                  <button
                    onClick={() => setActiveTab('students')}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${activeTab === 'students' ? 'bg-indigo-600 text-white shadow-xs' : 'text-slate-400 hover:text-white'}`}
                  >
                    Élèves & Scolarité
                  </button>
                  <button
                    onClick={() => setActiveTab('homework')}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 ${activeTab === 'homework' ? 'bg-indigo-600 text-white shadow-xs' : 'text-slate-400 hover:text-white'}`}
                  >
                    <span>Dossier Drive & Devoirs</span>
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  </button>
                  <button
                    onClick={() => setActiveTab('bulletins')}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${activeTab === 'bulletins' ? 'bg-indigo-600 text-white shadow-xs' : 'text-slate-400 hover:text-white'}`}
                  >
                    Bulletins Officiels
                  </button>
                </div>

                <button
                  onClick={() => setIsConfigModalOpen(true)}
                  className="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl border border-slate-700 text-xs font-bold transition-all"
                  title="Paramètres de l'école"
                >
                  ⚙
                </button>
              </div>
            </div>
          </header>

          {/* Navigation Mobile */}
          <div className="md:hidden flex items-center justify-around bg-slate-800 text-white p-2 border-b border-slate-700 text-[11px] font-bold">
            <button onClick={() => setActiveTab('grades')} className={activeTab === 'grades' ? 'text-indigo-400' : 'text-slate-400'}>Notes</button>
            <button onClick={() => setActiveTab('students')} className={activeTab === 'students' ? 'text-indigo-400' : 'text-slate-400'}>Élèves</button>
            <button onClick={() => setActiveTab('homework')} className={activeTab === 'homework' ? 'text-indigo-400' : 'text-slate-400'}>Devoirs Drive</button>
            <button onClick={() => setActiveTab('bulletins')} className={activeTab === 'bulletins' ? 'text-indigo-400' : 'text-slate-400'}>Bulletins</button>
          </div>

          {/* CONTENU PRINCIPAL */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">

            {/* ================= 1. CARNET DE NOTES ================= */}
            {activeTab === 'grades' && (
              <div className="space-y-4">
                <div className="bg-white rounded-2xl border border-slate-200/90 shadow-xs overflow-hidden">
                  <div className="p-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between flex-wrap gap-2">
                    <div>
                      <h2 className="text-sm font-extrabold text-slate-900">Carnet de Notes & Calcul des Moyennes — {currentClass}</h2>
                      <p className="text-xs text-slate-500">Moyenne matière = (Moyenne devoirs + Compo × 2) ÷ 3</p>
                    </div>
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => setIsSubmitModalOpen(true)}
                        className="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white text-xs font-extrabold rounded-xl shadow-xs"
                      >
                        📤 Simuler Dépôt Devoir
                      </button>
                      <button
                        onClick={() => showToast("Données sauvegardées en cache !")}
                        className="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-white text-xs font-extrabold rounded-xl shadow-xs"
                      >
                        Enregistrer
                      </button>
                    </div>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs border-collapse">
                      <thead>
                        <tr className="bg-slate-100 text-slate-600 font-extrabold border-b border-slate-200 uppercase tracking-wider">
                          <th className="p-3 border-r border-slate-200">Matricule</th>
                          <th className="p-3 border-r border-slate-200">Nom & Prénom</th>
                          {currentSubjects.map(s => (
                            <th key={s.id} className="p-2 text-center border-r border-slate-200">
                              <div>{s.name}</div>
                              <div className="text-[10px] text-indigo-600 font-normal">Coef {s.coef} (D1/D2/Comp)</div>
                            </th>
                          ))}
                          <th className="p-3 text-center border-r border-slate-200 bg-indigo-50/50">Moyenne</th>
                          <th className="p-3 text-center bg-indigo-50/50">Rang</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-200">
                        {currentStudents.map(st => {
                          const calc = studentCalculations[st.id] || {};
                          return (
                            <tr key={st.id} className="hover:bg-slate-50/80">
                              <td className="p-3 font-mono font-bold text-slate-500 border-r border-slate-200">{st.mat}</td>
                              <td className="p-3 font-bold text-slate-900 border-r border-slate-200">{st.lastName} {st.firstName}</td>
                              {currentSubjects.map(s => {
                                const gr = gradesData[st.id]?.[s.id] || {};
                                const avg = calc.subDetails?.[s.id]?.avg;
                                return (
                                  <td key={s.id} className="p-2 border-r border-slate-200">
                                    <div className="flex items-center justify-center gap-1">
                                      <input
                                        type="number"
                                        min="0" max="20" step="0.5"
                                        placeholder="D1"
                                        value={gr.d1 ?? ''}
                                        onChange={(e) => handleGradeChange(st.id, s.id, 'd1', e.target.value)}
                                        className="w-10 p-1 text-center bg-slate-50 border border-slate-200 rounded font-semibold text-xs outline-none focus:border-indigo-500"
                                      />
                                      <input
                                        type="number"
                                        min="0" max="20" step="0.5"
                                        placeholder="D2"
                                        value={gr.d2 ?? ''}

                  <div className="p-2.5 bg-indigo-50 rounded-xl border border-indigo-200 text-indigo-900">
                    <p className="font-bold">Destination Google Drive :</p>
                    <p className="text-[11px] font-mono">{teacherDriveConfig.folderName} ({teacherDriveConfig.organizationMode})</p>
                  </div>
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Document de la copie (Simulation PDF) :</label>
                    <input type="file" className="w-full text-slate-500 text-xs" />
                  </div>
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Message au professeur :</label>
                    <textarea name="comment" rows="2" placeholder="Ex: Bonjour Monsieur, voici ma copie rédigée..." className="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg outline-none"></textarea>
                  </div>
                  <div className="pt-3 flex justify-end gap-2">
                    <button type="button" onClick={() => setIsSubmitModalOpen(false)} className="px-3 py-1.5 text-slate-500 font-bold">Annuler</button>
                    <button type="submit" className="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white font-extrabold rounded-xl shadow-xs">Transmettre au Professeur</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ================= MODALE 3 : CONFIGURATION ÉTABLISSEMENT ================= */}
          {isConfigModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
              <div className="bg-white rounded-2xl border border-slate-200 shadow-2xl w-full max-w-lg overflow-hidden">
                <div className="p-4 bg-slate-900 text-white flex justify-between items-center">
                  <h3 className="text-sm font-extrabold">Paramètres de l'Établissement & Google Drive</h3>
                  <button onClick={() => setIsConfigModalOpen(false)} className="text-slate-400 hover:text-white font-bold">✕</button>
                </div>
                <div className="p-5 space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Nom de l'Établissement :</label>
                    <input value={config.schoolName} onChange={(e) => setConfig({ ...config, schoolName: e.target.value })} className="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg font-bold" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-bold text-slate-700 block mb-1">Année Scolaire :</label>
                      <input value={config.academicYear} onChange={(e) => setConfig({ ...config, academicYear: e.target.value })} className="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg" />
                    </div>
                    <div>
                      <label className="font-bold text-slate-700 block mb-1">Trimestre en cours :</label>
                      <input value={config.term} onChange={(e) => setConfig({ ...config, term: e.target.value })} className="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg" />
                    </div>
                  </div>
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Chef d'Établissement :</label>
                    <input value={config.headmaster} onChange={(e) => setConfig({ ...config, headmaster: e.target.value })} className="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg" />
                  </div>
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">URL Web App Google Apps Script :</label>
                    <input value={scriptUrl} onChange={(e) => setScriptUrl(e.target.value)} placeholder="https://script.google.com/macros/s/.../exec" className="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg font-mono text-[11px]" />
                  </div>
                  <div className="pt-3 flex justify-end">
                    <button onClick={() => { setIsConfigModalOpen(false); showToast("Paramètres sauvegardés !"); }} className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold rounded-xl shadow-xs">Enregistrer</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Pied de Page */}
          <footer className="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500 no-print">
            GestNotes Pro © 2026 — Système de Gestion Scolaire & Google Drive Apps Script
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
