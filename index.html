    <script>
        if (typeof idbKeyval === 'undefined') {
            window.idbKeyval = {
                get: async (key) => {
                    try {
                        const val = localStorage.getItem(key);
                        return val ? JSON.parse(val) : null;
                    } catch (e) { return null; }
                },
                set: async (key, val) => {
                    try {
                        localStorage.setItem(key, JSON.stringify(val));
                    } catch (e) {}
                }
            };
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker enregistré avec succès sur le scope :', reg.scope))
                    .catch(err => console.warn('Échec d\'enregistrement du Service Worker :', err));
            });
        }

        const classNames = ["CP", "CE1", "CE2", "CM1", "CM2", "6ème", "5ème", "4ème", "3ème", "Seconde", "Première", "Terminale"];
        const moisAnnee = ["Inscription", "Octobre", "Novembre", "Décembre", "Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet"];
        
        let subjectDev3Visible = {};
        let appState = null;
        
        let currentStudentIdForFinance = null;
        let currentMonthIdxForFinance = null;
        let editingStudentId = null;

        const DEFAULT_STATE = {
            currentYear: "2025-2026",
            currentSemester: 1,
            selectedClass: "6ème",
            selectedSection: "",
            currentRole: "admin",
            accessCode: "1234",          // Code d'accès modifiable (Admin/Comptable)
            googleSyncUrl: "",           // URL de votre application Web Google Apps Script
            waTemplates: {
                reminder: "Bonjour, nous vous rappelons que le paiement de {frais} de {montant} FCFA pour l'élève {eleve} ({classe}) reste attendu pour la période {periode}. Merci de votre confiance ! 🎓",
                bulletin: "Bonjour, nous vous informons que le bulletin de {eleve} ({classe}) pour la période {periode} est disponible au secrétariat de l'école. Cordialement. 🎓",
                receipt: "Bonjour, nous confirmons le règlement pour l'élève {eleve} ({classe}) d'un montant de {montant} FCFA au titre de : {frais} ({methode}) le {date}. Reste à payer global : {solde} FCFA. Merci de votre confiance ! 🎓"
            },
            classes: {}
        };

        function isPrimary(className) {
            return ["CP", "CE1", "CE2", "CM1", "CM2"].includes(className);
        }

        function getPeriodLabel(className, periodNum) {
            return isPrimary(className) ? `Trimestre ${periodNum}` : `Semestre ${periodNum}`;
        }

        // Configuration robuste de détection des classes primaires pour éviter les bugs
        function isPrimaryResilient(className) {
            const parts = (className || "").split('_');
            const mainClass = parts[0].toLowerCase();
            return mainClass.includes("primaire") || ["ci", "cp", "ce1", "ce2", "cm1", "cm2"].includes(mainClass);
        }

        function getDevoirLabel(className, num) {
            if (isPrimary(className)) {
                return `Note ${num}`;
            }
            return `Devoir ${num}`;
        }

        function getCoefLabel(className) {
            return isPrimary(className) ? "Max" : "Coef";
        }

        function getMensualitesExpectedCount() {
            return moisAnnee.length - 1;
        }

        function getSectionsForClass(cls) {
            if (["CP", "CE1", "CE2", "CM1", "CM2", "6ème", "5ème", "4ème", "3ème"].includes(cls)) {
                return ["", "A", "B", "C"];
            }
            if (["Seconde", "Première", "Terminale"].includes(cls)) {
                return ["L1", "L1A", "L1B", "L2", "L2A", "L2B", "S1", "S2", "S2A", "S2B"];
            }
            return [""];
        }

        function getDefaultSubjects(className) {
            if (isPrimary(className)) {
                return [
                    { id: "sub_lang", name: "Langue & Communication", coef: 10, teacherName: "", accessCode: "" },
                    { id: "sub_math", name: "Mathématiques", coef: 10, teacherName: "", accessCode: "" },
                    { id: "sub_es", name: "Éducation Science & Sociale", coef: 10, teacherName: "", accessCode: "" },
                    { id: "sub_ed", name: "Éducation Développement", coef: 10, teacherName: "", accessCode: "" }
                ];
            }
            return [
                { id: "sub_math", name: "Mathématiques", coef: 4, teacherName: "", accessCode: "" },
                { id: "sub_pc", name: "Physique-Chimie", coef: 3, teacherName: "", accessCode: "" },
                { id: "sub_svt", name: "SVT", coef: 2, teacherName: "", accessCode: "" },
                { id: "sub_fr", name: "Français", coef: 4, teacherName: "", accessCode: "" },
                { id: "sub_hg", name: "Histoire-Géographie", coef: 2, teacherName: "", accessCode: "" },
                { id: "sub_ang", name: "Anglais", coef: 2, teacherName: "", accessCode: "" }
            ];
        }

        function buildEmptyState() {
            if (!appState) appState = { classes: {} };
            if (!appState.classes) appState.classes = {};

            classNames.forEach(c => {
                const sections = getSectionsForClass(c);
                sections.forEach(s => {
                    const key = `${c}_${s}`;
                    if (!appState.classes[key]) {
                        appState.classes[key] = {
                            subjects: getDefaultSubjects(c),
                            students: [],
                            fees: { inscription: 0, mensualite: 0 },
                            dev3Visible: {}
                        };
                    }
                    if (!appState.classes[key].fees) {
                        appState.classes[key].fees = { inscription: 0, mensualite: 0 };
                    }
                    if (!appState.classes[key].students) {
                        appState.classes[key].students = [];
                    }
                    if (!appState.classes[key].subjects || appState.classes[key].subjects.length === 0) {
                        appState.classes[key].subjects = getDefaultSubjects(c);
                    }
                    if (!appState.classes[key].dev3Visible) {
                        appState.classes[key].dev3Visible = {};
                    }
                });
            });
        }

        // Nettoyage et formatage robuste des téléphones pour l'API WhatsApp
        function formatPhoneForWhatsApp(phone) {
            if (!phone) return "";
            let pure = phone.replace(/\D/g, ''); // Conserve uniquement les chiffres
            if (pure.startsWith('00221')) {
                pure = pure.substring(2);
            }
            if (pure.length === 9) {
                pure = "221" + pure;
            }
            return pure;
        }

        // Initialisation de l'application
        async function initApp() {
            const savedState = await idbKeyval.get("gestnotes_state");
            appState = savedState || DEFAULT_STATE;
            buildEmptyState();

            if (appState.accessCode === undefined) {
                appState.accessCode = "1234";
            }
            if (appState.googleSyncUrl === undefined) {
                appState.googleSyncUrl = "";
            }

            const role = localStorage.getItem("gestnotes_local_role") || "admin";
            appState.currentRole = role;

            if (role === "enseignant") {
                const tClass = localStorage.getItem("gestnotes_teacher_class");
                const tSection = localStorage.getItem("gestnotes_teacher_section");
                if (tClass) appState.selectedClass = tClass;
                if (tSection !== null) appState.selectedSection = tSection;
            }

            if (appState.waTemplates && !appState.waTemplates.receipt) {
                appState.waTemplates.receipt = DEFAULT_STATE.waTemplates.receipt;
            }

            populateFilters();
            updateHeaderDisplays();
            applyRoleRestrictions();
            render();

            // Lancement de la synchronisation au démarrage
            if (appState.googleSyncUrl) {
                setTimeout(chargerBaseDepuisDrive, 1000);
            }

            // Synchro automatique au retour sur l'application
            document.addEventListener("visibilitychange", () => {
                if (document.visibilityState === "visible" && appState.googleSyncUrl) {
                    chargerBaseDepuisDrive();
                }
            });

            // Synchro automatique toutes les 60 secondes
            setInterval(() => {
                if (appState.googleSyncUrl) {
                    chargerBaseDepuisDrive();
                }
            }, 60000);
        }
let driveSyncTimeout = null;

async function saveToStorage(forceCloud = true) {
    try {
        // Sauvegarde locale immédiate
        await idbKeyval.set("gestnotes_state", appState);
        
        // Sauvegarde Cloud différée (3 secondes après la fin de la saisie)
        if (forceCloud && appState.googleSyncUrl) {
            const lbl = document.getElementById('lbl-gdrive-sync');
            if (lbl) lbl.innerText = "Modif. locales...";

            clearTimeout(driveSyncTimeout);
            driveSyncTimeout = setTimeout(async () => {
                await sauvegarderSurDrive();
            }, 3000); 
        }
    } catch (err) {
        console.error("Erreur sauvegarde :", err);
    }
}
       

        // Récupération des données depuis le cloud (GET)
        async function chargerBaseDepuisDrive() {
            if (!appState.googleSyncUrl) return;
            
            const btn = document.getElementById('btn-gdrive-sync');
            const lbl = document.getElementById('lbl-gdrive-sync');
            if (lbl) lbl.innerText = "Chargement...";

            try {
                const response = await fetch(appState.googleSyncUrl);
                if (!response.ok) throw new Error("Réponse réseau non conforme");
                
                const dbState = await response.json();
                
                if (dbState && dbState.classes) {
                    // Conservation de l'URL locale de synchronisation et du code d'accès
                    const localUrl = appState.googleSyncUrl;
                    const localAccessCode = appState.accessCode;
                    
                    // Fusionner proprement
                    appState = dbState; 
                    appState.googleSyncUrl = localUrl; // On garde l'URL actuelle
                    if (!appState.accessCode) appState.accessCode = localAccessCode;
                    buildEmptyState();
                    await idbKeyval.set("gestnotes_state", appState);
                    
                    populateFilters();
                    updateHeaderDisplays();
                    applyRoleRestrictions();
                    render();
                    
                    if (btn) btn.className = "flex items-center justify-center gap-2 bg-emerald-600 text-white font-bold py-2.5 px-4 rounded-xl hover:bg-emerald-700 transition-all shadow-md text-sm";
                    if (lbl) lbl.innerText = "Cloud Synced";
                    showToast("Base synchronisée avec succès !", "success");
                }
            } catch (error) {
                console.error("Erreur lors du chargement cloud :", error);
                if (lbl) lbl.innerText = "Erreur Synchro";
                if (btn) btn.className = "flex items-center justify-center gap-2 bg-rose-600 text-white font-bold py-2.5 px-4 rounded-xl hover:bg-rose-700 transition-all shadow-md text-sm";
                showToast("Échec de la synchronisation cloud.", "error");
            }
        }

        // Envoi des données vers le cloud (POST)
        async function sauvegarderSurDrive() {
            if (!appState.googleSyncUrl) return;
            try {
                const response = await fetch(appState.googleSyncUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8' // Évite la requête préliminaire OPTIONS
                    },
                    body: JSON.stringify(appState)
                });
                if (response.ok) {
                    console.log("Sauvegarde cloud automatique réussie.");
                } else {
                    console.warn("Échec de la sauvegarde cloud.");
                }
            } catch (error) {
                console.error("Erreur de sauvegarde automatique sur le Drive :", error);
            }
        }

        function seConnecterAGoogleDrive() {
            if (!appState.googleSyncUrl) {
                alert("Veuillez configurer l'URL Web App de votre Google Apps Script dans les paramètres (⚙️).");
                openModal('settings-modal');
                return;
            }
            chargerBaseDepuisDrive();
        }

        function getCurrentClassKey() {
            return `${appState.selectedClass}_${appState.selectedSection}`;
        }

        function populateFilters() {
            const classSelect = document.getElementById('filter-class');
            classSelect.innerHTML = classNames.map(c => `<option value="${c}" ${appState.selectedClass===c?'selected':''}>${c}</option>`).join('');
            updateSectionFilterOptions();
        }

        function updateSectionFilterOptions() {
            const sectSelect = document.getElementById('filter-section');
            const sections = getSectionsForClass(appState.selectedClass);
            sectSelect.innerHTML = sections.map(s => `<option value="${s}" ${appState.selectedSection===s?'selected':''}>${s || 'Général'}</option>`).join('');
        }

        function updateHeaderDisplays() {
            document.getElementById('display-year').innerText = appState.currentYear;
            document.getElementById('display-semester').innerText = getPeriodLabel(appState.selectedClass, appState.currentSemester);
        }

        function onClassChange() {
            appState.selectedClass = document.getElementById('filter-class').value;
            appState.selectedSection = "";
            updateSectionFilterOptions();
            updateHeaderDisplays();
            render();
        }

        function onSectionChange() {
            appState.selectedSection = document.getElementById('filter-section').value;
            render();
        }

        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
            if (id === 'settings-modal') {
                document.getElementById('settings-year').value = appState.currentYear;
                updateSettingsPeriodSelect();
                populateRolloverSelector();

                // Hydrater les champs configurables
                document.getElementById('settings-access-code').value = appState.accessCode || "1234";
                document.getElementById('settings-gdrive-sync-url').value = appState.googleSyncUrl || "";

                // Filtrage des éléments de configuration visibles pour l'enseignant
                const role = localStorage.getItem("gestnotes_local_role") || "admin";
                const yearContainer = document.getElementById('settings-year-container');
                const rolloverContainer = document.getElementById('settings-rollover-container');
                const accessCodeContainer = document.getElementById('settings-access-code-container');
                const googleSyncContainer = document.getElementById('settings-gdrive-sync-url-container');

                if (role === 'enseignant') {
                    if (yearContainer) yearContainer.classList.add('hidden');
                    if (rolloverContainer) rolloverContainer.classList.add('hidden');
                    if (accessCodeContainer) accessCodeContainer.classList.add('hidden');
                    if (googleSyncContainer) googleSyncContainer.classList.add('hidden');
                } else {
                    if (yearContainer) yearContainer.classList.remove('hidden');
                    if (rolloverContainer) rolloverContainer.classList.remove('hidden');
                    if (accessCodeContainer) accessCodeContainer.classList.remove('hidden');
                    if (googleSyncContainer) googleSyncContainer.classList.remove('hidden');
                }
            }
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function updateSettingsPeriodSelect() {
            const select = document.getElementById('settings-semester');
            const primary = isPrimary(appState.selectedClass);
            if (primary) {
                select.innerHTML = `
                    <option value="1" ${appState.currentSemester==1?'selected':''}>Trimestre 1</option>
                    <option value="2" ${appState.currentSemester==2?'selected':''}>Trimestre 2</option>
                    <option value="3" ${appState.currentSemester==3?'selected':''}>Trimestre 3</option>
                `;
            } else {
                select.innerHTML = `
                    <option value="1" ${appState.currentSemester==1?'selected':''}>Semestre 1</option>

        function validerInscriptionOuChangement(e) {
            e.preventDefault();
            const firstName = document.getElementById('reg-firstname').value.trim();
            const lastName = document.getElementById('reg-lastname').value.trim();
            const dob = document.getElementById('reg-dob').value;
            const pob = document.getElementById('reg-pob').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const targetClass = document.getElementById('reg-class').value;
            const targetSection = document.getElementById('reg-section').value;
            
            const newKey = `${targetClass}_${targetSection}`;
            
            if (editingStudentId) {
                for (let k in appState.classes) {
                    let idx = appState.classes[k].students.findIndex(s => s.id === editingStudentId);
                    if (idx !== -1) {
                        let stObj = appState.classes[k].students[idx];
                        stObj.firstname = firstName;
                        stObj.lastname = lastName;
                        stObj.dob = dob;
                        stObj.pob = pob;
                        stObj.phone = phone;
                        
                        if (k !== newKey) {
                            appState.classes[k].students.splice(idx, 1);
                            if (!appState.classes[newKey]) appState.classes[newKey] = { students: [], subjects: getDefaultSubjects(targetClass), fees: { inscription: 0, mensualite: 0 } };
                            if (!appState.classes[newKey].students) appState.classes[newKey].students = [];
                            appState.classes[newKey].students.push(stObj);
                        }
                        break;
                    }
                }
            } else {
                if (!appState.classes[newKey]) {
                    appState.classes[newKey] = { students: [], subjects: getDefaultSubjects(targetClass), fees: { inscription: 0, mensualite: 0 } };
                }
                if (!appState.classes[newKey].students) appState.classes[newKey].students = [];

                const targetFees = appState.classes[newKey].fees || { inscription: 0, mensualite: 0 };
                const paymentsStructure = moisAnnee.map((m, idx) => ({
                    designation: m,
                    statut: "Non payé",
                    montantDu: idx === 0 ? (targetFees.inscription || 0) : (targetFees.mensualite || 0),
                    montantPaye: 0,
                    methode: "",
                    dateEncaissement: ""
                }));

                const newStudent = {
                    id: "student_" + Date.now(),
                    firstname: firstName,
                    lastname: lastName,
                    dob: dob,
                    pob: pob,
                    phone: phone,
                    grades: {},
                    payments: paymentsStructure
                };
                appState.classes[newKey].students.push(newStudent);
            }
            
            saveToStorage();
            closeModal('registration-modal');
            showToast("Élève enregistré avec succès !", "success");
            
            populateFilters();
            updateHeaderDisplays();
            render();
        }

                                <i class="fas fa-undo"></i>
                            </button>
                        </div>
                    `;
                }

                if (p.designation === 'Inscription') {
                    designationLabel = 'Frais d\'inscription';
                } else if (p.designation === 'Dette Antérieure') {
                    designationLabel = 'Dette de l\'année précédente';
                } else {
                    designationLabel = 'Mensualité ' + p.designation;

        function validerEncaissement() {
            let student = null;
            for (let k in appState.classes) {
                student = appState.classes[k].students.find(s => s.id === currentStudentIdForFinance);
                if (student) break;
            }
            if (!student) return;

            const amt = parseInt(document.getElementById('encaissement-montant-input').value) || 0;
            const method = document.getElementById('encaissement-methode-select').value;
            
            if (amt <= 0) {

                return;
            }

            const p = student.payments[currentMonthIdxForFinance];
            p.montantPaye = amt;
            p.statut = "Payé";
            p.methode = method;
            
            const today = new Date();
            p.dateEncaissement = today.toLocaleDateString('fr-FR') + " " + today.toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'});

            saveToStorage();
            closeModal('encaissement-modal');

        function imprimerRecu(studentId, monthIdx) {
            let student = null;
            let classKey = "";
            for (let k in appState.classes) {
                student = appState.classes[k].students.find(s => s.id === studentId);
                if (student) { classKey = k; break; }
            }
            if (!student) return;

            const p = student.payments[monthIdx];
            const parts = classKey.split('_');

            document.getElementById('recu-id').innerText = `GN-${Date.now().toString().slice(-6)}`;
            document.getElementById('recu-date').innerText = p.dateEncaissement.split(' ')[0];
            document.getElementById('recu-eleve-nom').innerText = `${student.firstname} ${student.lastname}`;
            document.getElementById('recu-eleve-classe').innerText = `Classe : ${parts[0]} ${parts[1] || ''}`;
            document.getElementById('recu-annee-scolaire').innerText = appState.currentYear;
            
            let designationText = "";
            if (p.designation === 'Inscription') {
                designationText = 'Frais d\'inscription scolaire';
            } else if (p.designation === 'Dette Antérieure') {
                designationText = 'Règlement dette de l\'année précédente';
            } else {
                designationText = `Frais de scolarité - Mois de ${p.designation}`;
            }
            document.getElementById('recu-designation').innerText = designationText;
            document.getElementById('recu-methode').innerText = p.methode;
            document.getElementById('recu-montant').innerText = `${p.montantPaye.toLocaleString()} FCFA`;
            document.getElementById('recu-total').innerText = `${p.montantPaye.toLocaleString()} FCFA`;

            const source = document.getElementById('recu-template-container');
            const clone = source.cloneNode(true);
            
            clone.style.position = 'absolute';
            clone.style.left = '0px';
            clone.style.top = '0px';
            clone.style.width = '700px';
            clone.style.zIndex = '-9999';
            clone.style.backgroundColor = '#ffffff';
            
            document.body.appendChild(clone);

            const options = {
                margin: 10,
                filename: `Recu_${p.designation}_${student.lastname}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true, logging: false, scrollY: 0, scrollX: 0 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(options).from(clone).save().then(() => {
                clone.remove();
            });
        }

        function partagerWhatsApp(studentId, monthIdx) {
            let student = null;
            let classKey = "";
            for (let k in appState.classes) {
                student = appState.classes[k].students.find(s => s.id === studentId);
                if (student) { classKey = k; break; }
            }
            if (!student || !student.phone) {
                showToast("Aucun numéro parent configuré sur la fiche de cet élève.", "info");
                return;
            }

            try {
                imprimerRecu(studentId, monthIdx);
            } catch (err) {
                console.error("Erreur lors de la génération automatique du reçu :", err);
            }

            const p = student.payments[monthIdx];
            const classNameDisplay = classKey.replace('_', ' ');
            let typeFrais = "";
            if (p.designation === 'Inscription') {
                typeFrais = "Frais d'inscription";
            } else if (p.designation === 'Dette Antérieure') {
                typeFrais = "Dette de l'année précédente";
            } else {
                typeFrais = `Mensualité de ${p.designation}`;
            }

            let totalDu = student.payments.reduce((acc, curr) => acc + (curr.montantDu || 0), 0);
            let totalPaye = student.payments.reduce((acc, curr) => acc + (curr.montantPaye || 0), 0);
            let resteAPayer = Math.max(0, totalDu - totalPaye);

            const tpl = appState.waTemplates.receipt || "Bonjour, nous vous rappelons que le paiement de {frais} de {montant} FCFA pour l'élève {eleve} ({classe}) reste attendu pour la période {periode}. Merci de votre confiance ! 🎓";
            let msg = tpl
                .replace(/{eleve}/g, `${student.firstname} ${student.lastname.toUpperCase()}`)
                .replace(/{classe}/g, classNameDisplay)
                .replace(/{frais}/g, typeFrais)
                .replace(/{montant}/g, p.montantPaye.toLocaleString())
                .replace(/{methode}/g, p.methode)
                .replace(/{date}/g, p.dateEncaissement.split(' ')[0])
                .replace(/{solde}/g, resteAPayer.toLocaleString());
            
            let purePhone = formatPhoneForWhatsApp(student.phone);

            const url = `https://api.whatsapp.com/send?phone=${purePhone}&text=${encodeURIComponent(msg)}`;
            
            alert(`ℹ️ Reçu PDF officiel téléchargé !\n\nLe reçu de paiement a été enregistré sur votre appareil.\n\nVous allez maintenant être redirigé vers WhatsApp. Veuillez joindre ce fichier PDF téléchargé en tant que pièce jointe (or par glisser-déposer) dans la discussion avec le parent.`);

            window.open(url, '_blank');
        }

        function calculerMoyenneEleveMatiere(student, subjectId) {
            const semKey = "p_" + appState.currentSemester;
            if (!student.grades || !student.grades[semKey] || !student.grades[semKey][subjectId]) return null;
            const g = student.grades[semKey][subjectId];
            const d1 = parseFloat(g.dev1);
            const d2 = parseFloat(g.dev2);
            const d3 = parseFloat(g.dev3);
            const compo = parseFloat(g.compo);
            const isPrim = isPrimary(appState.selectedClass);

            let hasDev = false;
            let sumDev = 0;
            let countDev = 0;

            if (!isNaN(d1)) { sumDev += d1; countDev++; hasDev = true; }
            
            if (isPrim) {
                if (!isNaN(d2)) { sumDev += d2; countDev++; hasDev = true; }
            } else {
                if (!isNaN(d2)) { sumDev += d2; countDev++; hasDev = true; }
                const key = getCurrentClassKey();
                const dev3Active = !!(appState.classes[key] && appState.classes[key].dev3Visible && appState.classes[key].dev3Visible[subjectId]);
                if (dev3Active && !isNaN(d3)) { sumDev += d3; countDev++; hasDev = true; }
            }

            let moyDev = hasDev ? (sumDev / countDev) : 0;

            if (isPrim) {
                if (hasDev && !isNaN(compo)) return (moyDev + compo) / 2;
                if (!isNaN(compo)) return compo;
                if (hasDev) return moyDev;
                return null;
            } else {
                if (hasDev && !isNaN(compo)) return (moyDev + (compo * 2)) / 3;
                if (!isNaN(compo)) return compo;
                if (hasDev) return moyDev;
                return null;
            }
        }

        function calculerMoyenneGeneraleGlobale(student, subjects) {
            let totalPoints = 0;
            let totalCoefs = 0;

            subjects.forEach(sub => {
                let calcul = calculerMoyenneEleveMatiere(student, sub.id);
                if (calcul !== null) {
                    totalPoints += calcul * (sub.coef || 1);
                    totalCoefs += (sub.coef || 1);
                }
            });

            if (totalCoefs === 0) return null;
            return totalPoints / totalCoefs;
        }

        function obtenirRangsClasse(students, subjects) {
            const studentAverages = students.map(s => {
                const avg = calculerMoyenneGeneraleGlobale(s, subjects);
                return { id: s.id, avg: avg !== null ? avg : -1 };
            });
            studentAverages.sort((a, b) => b.avg - a.avg);
            
            const ranks = {};
            let currentRank = 1;
            for (let i = 0; i < studentAverages.length; i++) {
                const item = studentAverages[i];
                if (item.avg === -1) {
                    ranks[item.id] = "N/A";
                    continue;
                }
                if (i > 0 && studentAverages[i - 1].avg === item.avg) {
                    let tieRank = currentRank;
                    for (let j = i - 1; j >= 0; j--) {
                        if (studentAverages[j].avg === item.avg) {
                            if (ranks[studentAverages[j].id] && ranks[studentAverages[j].id].rankNum !== undefined) {
                                tieRank = ranks[studentAverages[j].id].rankNum;
                            }
                        } else {
                            break;
                        }
                    }
                    ranks[item.id] = { label: tieRank === 1 ? "1er ex" : `${tieRank}e ex`, rankNum: tieRank };
                } else {
                    currentRank = i + 1;
                    ranks[item.id] = { label: currentRank === 1 ? "1er" : `${currentRank}e`, rankNum: currentRank };
                }
            }
            return ranks;
        }

        function calculateClassStats() {
            const key = getCurrentClassKey();
            const clsData = appState.classes[key];
            if (!clsData) return;

            const students = clsData.students || [];
            const fees = clsData.fees || { inscription: 0, mensualite: 0 };
            
            let totalExpected = 0;
            let totalCollected = 0;

            students.forEach(s => {
                const insExpected = fees.inscription || 0;
                const monthlyExpected = (fees.mensualite || 0) * getMensualitesExpectedCount();
                totalExpected += (insExpected + monthlyExpected);

                if (s.payments) {
                    s.payments.forEach(p => {
                        totalCollected += (p.montantPaye || 0);
                    });
                }
            });

            const totalRemaining = totalExpected - totalCollected;
            const recoveryRate = totalExpected > 0 ? ((totalCollected / totalExpected) * 100).toFixed(1) : 0;

            document.getElementById('stats-total-attendu').innerText = totalExpected.toLocaleString() + " F";
            document.getElementById('stats-total-encaisse').innerText = totalCollected.toLocaleString() + " F";
            document.getElementById('stats-reste-recouvrer').innerText = totalRemaining.toLocaleString() + " F";
            document.getElementById('stats-taux-recouvrement').innerText = recoveryRate + "%";
        }

function executeRollover() {
    const targetClass = document.getElementById('rollover-target-class').value;
    const key = getCurrentClassKey();
    const currentClsData = appState.classes[key];
    
    if (!currentClsData || !currentClsData.students || currentClsData.students.length === 0) {
        showToast("Aucun élève dans la classe actuelle.", "error");
        return;
    }

    askConfirmation(
        `Transférer les ${currentClsData.students.length} élèves vers la classe de ${targetClass} ?\nLes notes seront réinitialisées pour la nouvelle année.`,
        `<i class="fas fa-random text-amber-600"></i> Confirmer la Transition`,
        function() {
            // On détermine la section de destination (Général par défaut si la section n'existe plus)
            const validSections = getSectionsForClass(targetClass);
            let targetSection = appState.selectedSection;
            if (!validSections.includes(targetSection)) targetSection = validSections[0] || "";

            const targetKey = `${targetClass}_${targetSection}`;
            
            // Initialiser la classe de destination si besoin
            if (!appState.classes[targetKey]) {
                appState.classes[targetKey] = {
                    students: [],
                    subjects: getDefaultSubjects(targetClass),
                    fees: { inscription: 0, mensualite: 0 },
                    dev3Visible: {}
                };
            }
            
            const targetFees = appState.classes[targetKey].fees || { inscription: 0, mensualite: 0 };

            currentClsData.students.forEach(s => {
                // Création d'un nouvel échéancier financier vierge
                const newPayments = moisAnnee.map((m, idx) => ({
                    designation: m,
                    statut: "Non payé",
                    montantDu: idx === 0 ? (targetFees.inscription || 0) : (targetFees.mensualite || 0),
                    montantPaye: 0, methode: "", dateEncaissement: ""
                }));

                const promotedStudent = {
                    ...s,
                    id: "student_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5),
                    previousClassName: appState.selectedClass,
                    grades: {}, // Efface les notes
                    payments: newPayments // Nouveau carnet de paiement
                };
                appState.classes[targetKey].students.push(promotedStudent);
            });
            
            // Vider la classe d'origine (Transfert pur)
            currentClsData.students = [];
            
            saveToStorage();
            appState.selectedClass = targetClass;
            appState.selectedSection = targetSection;
            populateFilters();
            closeModal('settings-modal');
            showToast(`Transition vers ${targetClass} effectuée !`, "success");
            render();
        }
    );

                const val2 = formatVal(g.dev2);
                const val3 = formatVal(g.dev3);
                const valCompo = formatVal(g.compo);

                const moyVal = calculerMoyenneEleveMatiere(s, subjectId);
                let moyStr = "-";
                if (moyVal !== null) {
                    moyStr = Number(moyVal.toFixed(2)).toString().replace('.', ',');
                }

                const rowBg = idx % 2 === 0 ? "#ffffff" : "#f8fafc";

                html += `
                    <tr style="background-color: ${rowBg}; border-bottom: 1px solid #cbd5e1;">
                        <td style="border: 1px solid #cbd5e1; padding: 8px 12px; font-weight: bold; color: #1e293b;">
                            ${s.firstname} <span style="font-weight: 500; color: #475569;">${s.lastname.toUpperCase()}</span>
                        </td>
                        <td style="border: 1px solid #cbd5e1; padding: 8px; text-align: center; font-weight: 600;">${val1}</td>
                        <td style="border: 1px solid #cbd5e1; padding: 8px; text-align: center; font-weight: 600;">${val2}</td>
                        ${dev3Visible ? `<td style="border: 1px solid #cbd5e1; padding: 8px; text-align: center; font-weight: 600;">${val3}</td>` : ''}
                        <td style="border: 1px solid #cbd5e1; padding: 8px; text-align: center; font-weight: 600;">${valCompo}</td>
                        <td style="border: 1px solid #cbd5e1; padding: 8px; text-align: center; font-weight: 700; color: #4c1d95; background-color: #f1f5f9;">${moyStr}</td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>

                <div style="margin-top: 40px; display: flex; justify-content: space-between; font-size: 10px; color: #94a3b8;">
                    <div>
                        <p style="margin: 0;">Rapport généré le ${new Date().toLocaleDateString('fr-FR')} &agrave; ${new Date().toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'})}</p>
                        <p style="margin: 2px 0 0;">GestNotes &bull; Administration scolaire numérique</p>
                    </div>
                    <div style="text-align: center; width: 220px; border-top: 1px dashed #cbd5e1; padding-top: 8px;">
                        <p style="margin: 0; font-weight: 700; color: #475569; text-transform: uppercase;">Cachet et Signature Enseignant</p>
                    </div>
                </div>
            `;

            printDiv.innerHTML = html;

            printDiv.style.position = 'absolute';
            printDiv.style.left = '0px';
            printDiv.style.top = '0px';
            printDiv.style.width = '800px';
            printDiv.style.zIndex = '-9999';
            printDiv.style.backgroundColor = '#ffffff';

            document.body.appendChild(printDiv);

            const options = {
                margin: 10,
                filename: `Grille_Saisie_${appState.selectedClass}_${subjectName.replace(/[^a-zA-Z0-9]/g, "_")}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true, logging: false, scrollY: 0, scrollX: 0 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(options).from(printDiv).save().then(() => {
                printDiv.remove();
            });
        }

        function cleanStringForFuzzy(str) {
            if (!str) return "";
            return str.toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[^a-z0-9]/g, "");
        }

        // Ecouteur d'initialisation de l'application au chargement du DOM
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>

</html>
